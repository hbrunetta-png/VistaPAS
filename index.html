<style>
/* Layout: barra superior navy + área de trabajo en tarjetas blancas sobre gris frío, ficha 360° en grilla 2/3 + 1/3 */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f7f8fb; --line:#e3e6ec; --line-2:#eef0f4;
  --fg:#141a2b; --fg-2:#5b6478; --fg-3:#8a92a3;
  --nav:#1b2034; --nav-fg:#c9cede; --nav-active:#ffffff; --brand:#f07a2c;
  --nav-field:rgba(255,255,255,.08); --nav-line:rgba(255,255,255,.06); --nav-ph:#8f97ad; --nav-hover:rgba(255,255,255,.08); --nav-avatar:#2c3350;
  --blue:#2d6ce8; --blue-soft:#e8effd; --green:#2e9e4f; --green-btn:#2fa04f; --green-soft:#e4f5e9;
  --orange:#d9631f; --orange-soft:#fdf0e6; --orange-line:#f6c9a8; --purple:#8e3fb5; --purple-soft:#f3e6fa;
  --red:#d63b3b; --chip:#eef0f4;
  --s1:#2a78d6; --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c0:#a3a7b3;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131c; --surface:#181c28; --surface-2:#1e2331; --line:#2a3042; --line-2:#232838;
  --fg:#e9ecf3; --fg-2:#a4abbd; --fg-3:#7c8498;
  --nav:#0b0e16; --nav-fg:#aab1c4; --nav-active:#ffffff;
  --blue:#5b8ff2; --blue-soft:#1d2a47; --green:#4cc06b; --green-btn:#2c9a4a; --green-soft:#183225;
  --orange:#f08b4b; --orange-soft:#2e2118; --orange-line:#5a3a24; --purple:#c07ae3; --purple-soft:#2c1f38;
  --red:#f06b6b; --chip:#252b3b;
  --s1:#3987e5; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c0:#5d6478; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --surface:#181c28; --surface-2:#1e2331; --line:#2a3042; --line-2:#232838;
  --fg:#e9ecf3; --fg-2:#a4abbd; --fg-3:#7c8498;
  --nav:#0b0e16; --nav-fg:#aab1c4; --nav-active:#ffffff;
  --blue:#5b8ff2; --blue-soft:#1d2a47; --green:#4cc06b; --green-btn:#2c9a4a; --green-soft:#183225;
  --orange:#f08b4b; --orange-soft:#2e2118; --orange-line:#5a3a24; --purple:#c07ae3; --purple-soft:#2c1f38;
  --red:#f06b6b; --chip:#252b3b;
  --s1:#3987e5; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c0:#5d6478; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);box-shadow:inset 0 -1px 0 var(--nav-line)}
.top-in{display:flex;align-items:center;gap:16px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;color:var(--nav-active);font-weight:700;font-size:19px;white-space:nowrap;background:none;border:0;padding:0}
.logo-ic{width:34px;height:34px;display:block;flex:none}
.tabs{display:flex;gap:4px;height:100%;flex:1 1 0;min-width:0}
.tabs-main{display:flex;gap:4px;height:100%;flex:0 1 auto;min-width:0;overflow:hidden}
.more{position:relative;height:100%;flex:none}
.more-btn{display:inline-flex;align-items:center;gap:4px}
.more-btn svg{transition:transform .15s}
.more-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.more-menu{position:absolute;top:calc(100% - 4px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(10,15,30,.22);padding:6px;display:grid;gap:2px;z-index:30}
.more-menu button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:7px;color:var(--fg);font-size:14.5px;white-space:nowrap}
.more-menu button:hover,.more-menu button:focus-visible{background:var(--surface-2)}
.more-menu button[aria-current="page"]{color:var(--blue);font-weight:600}
.more-menu .sep{height:1px;background:var(--line-2);margin:4px 6px}
.more-menu .cfg-link{color:var(--fg-2);font-size:13.5px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:0;background:none;color:var(--nav-fg);display:grid;place-items:center;flex:none}
.icon-btn:hover{color:var(--nav-active);background:var(--nav-hover)}
.icon-btn.on{color:var(--nav-active);background:var(--nav-hover);box-shadow:inset 0 0 0 1px var(--nav-line)}

/* Filtros, selección y acciones en masa */
.filters input[type=search]{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:13.5px;flex:1 1 240px;min-width:0;max-width:380px}
.fcount{font-size:13px;color:var(--fg-2);margin-left:auto;white-space:nowrap}
.flbl{font-size:13px;font-weight:600;color:var(--fg-2);margin-right:2px}
.ftop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ftop input[type=search]{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:14px;flex:1 1 280px;min-width:0;max-width:440px}
.ftop select{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:13.5px;max-width:100%}
.fbtn{height:38px;font-size:14px}
.fbtn.on{border-color:var(--blue);color:var(--blue)}
.fquick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--fg-2)}
.qchip .num{font-size:12px;color:var(--fg-3);font-weight:600}
.qchip:hover{border-color:var(--fg-3);color:var(--fg)}
.qchip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.qchip[aria-pressed="true"] .num{color:var(--blue)}
.fpanel{padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 20px}
.fgroup{display:grid;gap:8px;align-content:start}
.fgroup .vgroup{margin:0}
.fsel{display:grid;gap:3px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.fsel select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:13.5px;font-weight:400;color:var(--fg);min-width:0}
.fpanel-a{grid-column:1 / -1;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line-2);padding-top:12px;margin-top:4px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);background:var(--blue-soft);color:var(--fg);border-radius:999px;padding:4px 8px 4px 12px;font-size:13px}
.fchip b{font-weight:600}
.fchip span{font-size:15px;line-height:1;color:var(--fg-2);padding:0 2px}
.fchip:hover span{color:var(--red)}
@media (max-width:980px){.fpanel{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.fpanel{grid-template-columns:1fr}}
.btn.qf{height:36px;gap:6px}
.btn.qf[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.chip.bday{font-size:12px;padding:1px 8px;margin-left:6px;font-weight:600;vertical-align:1px}
.bulk{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:10px;background:var(--blue-soft);border:1px solid var(--blue);box-shadow:0 6px 16px rgba(10,15,30,.08)}
.bulk .grow{flex:1;min-width:200px}
.bulk .btn.sm{background:var(--surface)}
.bulk .btn.danger{background:var(--surface)}
th.selc,td.selc{width:46px;padding-left:18px;padding-right:4px;cursor:pointer}
.selc input{width:18px;height:18px;margin:0;accent-color:var(--blue);cursor:pointer;vertical-align:middle}
tr.sel td{background:var(--blue-soft)}
tr.click.sel:hover td{background:var(--blue-soft)}
.actions .btn svg{flex:none}

/* Color del menú */
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-size:13.5px;font-weight:500;color:var(--fg)}
.sw i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw:hover{border-color:var(--fg-3)}
.sw[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft);font-weight:600}
.custom-c{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.custom-c input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px;cursor:pointer}
.custom-c input[type=text]{height:38px;width:116px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}
.tab{background:none;border:0;color:var(--nav-fg);padding:0 12px;height:100%;font-size:15px;position:relative;white-space:nowrap}
.tab:hover{color:var(--nav-active)}
.tab[aria-current="page"],.tab.cur{color:var(--nav-active);font-weight:600}
.tab[aria-current="page"]::after,.tab.cur::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
.search{margin-left:auto;position:relative;flex:0 1 260px;min-width:0}
@media (max-width:1180px){.search{flex-basis:190px}}
@media (max-width:560px){.logo span{display:none}}
.search input{width:100%;height:38px;border-radius:8px;border:1px solid var(--nav-line);background:var(--nav-field);color:var(--nav-active);padding:0 14px}
.search input::placeholder{color:var(--nav-ph)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(10,15,30,.18);overflow:hidden}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.results button:hover{background:var(--surface-2)}
.results small{display:block;color:var(--fg-3)}
.avatar-me{width:34px;height:34px;border-radius:50%;background:var(--nav-avatar);color:var(--nav-active);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}

/* Contenido */
main{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.crumbs{color:var(--fg-2);margin-bottom:14px;font-size:15px}
.crumbs button{background:none;border:0;padding:0;color:var(--fg-2)}
.crumbs button:hover{color:var(--blue)}
.crumbs b{color:var(--fg);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:20px 22px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.count{background:var(--chip);color:var(--fg-2);font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px}
.stack{display:grid;gap:16px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:24px;font-weight:700}
.muted{color:var(--fg-2)}
.small{font-size:12.5px;color:var(--fg-3)}

/* Botones */
.btn{height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--fg-3)}
.btn.wa{background:var(--green-btn);border-color:var(--green-btn);color:#fff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--blue)}

/* Chips */
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;background:var(--chip);color:var(--fg-2);white-space:nowrap}
.chip.purple{background:var(--purple-soft);color:var(--purple)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.orange{background:var(--orange-soft);color:var(--orange)}
.chip.red{background:var(--orange-soft);color:var(--red)}
.st{font-weight:600;font-size:13px}

/* Encabezado del cliente */
.hero .actions{grid-column:1 / -1;justify-content:flex-start;padding-top:16px;border-top:1px solid var(--line-2)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,auto);gap:22px 28px;align-items:center;padding:24px 24px}
.av{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:28px}
.hero h1{font-size:32px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.facts{display:grid;grid-template-columns:auto auto;gap:4px 28px;font-size:15px}
.facts dt{color:var(--fg-2)}
.facts dd{margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Banner */
.banner{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:var(--r);background:var(--orange-soft);border:1px solid var(--orange-line);font-size:15.5px}
.banner .ic{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.banner b{color:var(--orange)}
.banner .grow{flex:1;min-width:0}
.banner button{background:none;border:0;color:var(--fg-2);white-space:nowrap}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.kpi{padding:18px 20px}
.kpi .lb{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.kpi .v{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--green)}

/* Grilla ficha */
.grid{display:grid;grid-template-columns:minmax(0,2.55fr) minmax(0,1fr);gap:16px;align-items:start}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
td .sub{display:block;font-size:13px;color:var(--fg-3);margin-top:2px}
tr.warn td{background:var(--orange-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.ramo{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.rb{width:30px;height:30px;border-radius:7px;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}

.fam{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fam button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.fam button:hover{border-color:var(--blue)}
.fam b{display:block}
.fam span{color:var(--fg-2);font-size:13.5px}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .big{font-size:42px;font-weight:800;color:var(--purple);font-variant-numeric:tabular-nums;line-height:1}
.bars{display:flex;gap:6px;margin-bottom:6px}
.bars i{width:34px;height:9px;border-radius:5px;background:var(--line)}
.bars i.on{background:var(--purple)}
.task{display:flex;align-items:center;gap:12px;padding:6px 0}
.task input{width:18px;height:18px;accent-color:var(--blue);flex:none}
.task label{flex:1;min-width:0}
.task.done label{text-decoration:line-through;color:var(--fg-3)}
.task.done .due{color:var(--fg-3)!important;font-weight:500}
.task .due{font-weight:600;color:var(--orange);font-size:13.5px}
.feed{display:grid}
.feed>div{display:grid;grid-template-columns:52px 30px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.feed .dot{width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.feed .d{color:var(--fg-2);font-size:13.5px;padding-top:3px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;align-content:start}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);display:flex;justify-content:space-between}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s,border-color .15s}
.opp:hover{border-color:var(--fg-3);box-shadow:0 2px 8px rgba(10,15,30,.06)}
.opp.ph{opacity:.35;border-style:dashed}
.opp-ghost{position:fixed;z-index:70;margin:0;pointer-events:none;cursor:grabbing;box-shadow:0 16px 34px rgba(10,15,30,.28);transform:rotate(2deg);border-color:var(--blue)}
body.dragging-opp,body.dragging-opp *{cursor:grabbing!important;user-select:none}
.col{transition:background .12s,border-color .12s}
.col.drop-on{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.kb-empty{padding:14px 6px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.kb-close{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:65;display:none;gap:12px}
body.dragging-opp .kb-close{display:flex}
.kb-drop{min-width:170px;padding:16px 20px;border-radius:12px;border:2px dashed;font-weight:700;text-align:center;background:var(--surface);box-shadow:0 10px 26px rgba(10,15,30,.18);transition:background .12s,transform .12s}
.kb-drop.win{border-color:var(--green);color:var(--green)}
.kb-drop.lose{border-color:var(--red);color:var(--red)}
.kb-drop.win.drop-on{background:var(--green-soft);transform:scale(1.04)}
.kb-drop.lose.drop-on{background:var(--orange-soft);transform:scale(1.04)}
@media (max-width:520px){.kb-drop{min-width:0;padding:14px 16px}}
.opp b{font-size:14.5px}
.opp .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg-2)}
.opp select{height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;padding:0 6px}

/* Reportes */
.hbar{display:grid;grid-template-columns:140px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:7px 0}
.hbar .track{height:12px;border-radius:6px;background:var(--line-2);overflow:hidden}
.hbar .fill{height:100%;border-radius:6px;background:var(--blue)}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,25,.45);display:grid;place-items:center;padding:16px}
.dialog{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:22px;display:grid;gap:14px}
.dialog h2{font-size:19px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--fg-2)}
.field input,.field select,.field textarea{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface)}
.field textarea{height:80px;padding:10px 12px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog .foot{display:flex;justify-content:flex-end;gap:10px}
.copyrow{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;font-weight:600}
.copyrow span{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;font-size:12.5px;color:var(--fg-3)}
.empty{padding:22px;color:var(--fg-3);text-align:center}

@media (max-width:1180px){
  .hero{grid-template-columns:auto minmax(0,1fr)}
  .facts,.actions{grid-column:1 / -1}
  .actions{justify-content:flex-start}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .top-in{gap:12px}
  .search{display:none}
  .hero h1{font-size:26px}
  .av{width:60px;height:60px;font-size:21px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fam,.two,.frow{grid-template-columns:1fr}
  .banner{flex-wrap:wrap}
  .hbar{grid-template-columns:96px minmax(0,1fr) 92px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Importación y primer uso */
.notice{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;border-radius:var(--r);background:var(--blue-soft);border:1px solid var(--line)}
.notice .grow{flex:1;min-width:220px}
.notice b{display:block;font-size:15px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--surface-2);display:grid;gap:6px;justify-items:center}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop input{max-width:100%}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.issues{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;display:grid;gap:4px}
.issues .e{color:var(--red)}
.issues .w{color:var(--orange)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.radio input{margin-top:3px;accent-color:var(--blue)}
.btn.danger{color:var(--red);border-color:var(--orange-line)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.avatar-me{border:0;padding:0}
@media (max-width:720px){.sum{grid-template-columns:1fr 1fr 1fr}.sum b{font-size:18px}}

/* Compañías */
.lbl{font-size:13px;font-weight:600;color:var(--fg-2)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:500;color:var(--fg);cursor:pointer}
.checks input{width:auto;height:auto;padding:0;margin:0;accent-color:var(--blue)}
.checks label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
a.ext{color:var(--blue);text-decoration:none}
a.ext:hover{text-decoration:underline}
.mini-tags{display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
.mini-tags .chip{font-size:12px;padding:2px 8px}

/* Subnavegación y filtros */
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--chip);border-radius:10px;margin-bottom:14px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:7px;padding:6px 14px;font-weight:600;color:var(--fg-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(10,15,30,.08)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:13.5px;max-width:100%;min-width:0}

/* Análisis */
.an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.an-card.full{grid-column:1/-1}
.an-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.an-h h2{font-size:16px}
.an-a{display:flex;gap:2px;flex:none}
.an-a .btn.sm{height:30px;padding:0 8px;font-size:13px}
.an-a .btn[disabled]{opacity:.35;cursor:default}
.hb{display:grid;gap:2px}
.hb-row{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 6px;border-radius:6px}
.hb-row:hover,.hb-row:focus-visible{background:var(--surface-2)}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.hb-t{display:block;height:14px}
.hb-f{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hb-f.o{background:var(--c0)}
.hb-v{font-size:13px;font-weight:600;min-width:64px;text-align:right}
.vc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding-top:8px}
.vc-y{position:relative;height:200px;min-width:44px;font-size:11.5px;color:var(--fg-3)}
.vc-y span{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap}
.vc-plot{position:relative;height:200px;border-bottom:1px solid var(--line)}
.vc-g{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.vc-cols{position:absolute;inset:0;display:flex;gap:2px}
.vc-c{position:relative;flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center;border-radius:4px 4px 0 0}
.vc-c:hover,.vc-c:focus-visible{background:var(--surface-2)}
.vc-c.ln:hover,.vc-c.ln:focus-visible{background:none}
.vc-c.ln:hover::before,.vc-c.ln:focus-visible::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid var(--line)}
.vc-b{width:min(70%,44px);background:var(--s1);border-radius:4px 4px 0 0;min-height:1px}
.vc-b.o{background:var(--c0)}
.vc-lab{position:absolute;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;white-space:nowrap}
.vc-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

.ed-ph{border:2px dashed #c9cede;border-radius:8px;padding:20px 12px;text-align:center;color:#8a92a3;font:600 13px Inter,system-ui,sans-serif;background:#f7f8fb;box-sizing:border-box}

<script>
/*IMPORTER-START*/
var CarteraImporter = (function(){
  "use strict";
  const norm = s => String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const clean = v => v == null ? "" : String(v).trim();
  const ALIAS = {
    cli: {dni:["dnicuit","dni","cuit","cuil","documento","nrodedocumento"], nombre:["nombreyapellido","nombre","razonsocial","cliente","asegurado","apellidoynombre"], tipo:["tipo"], tel:["whatsapp","telefono","celular","movil"], email:["email","mail","correo","correoelectronico"], domicilio:["domicilio","direccion","localidad"], nac:["fechadenacimiento","nacimiento","fechanacimiento"], desde:["clientedesde","alta","fechadealta"], viv:["viviendapropia","vivienda"], canal:["canalpreferido","canal"], grupo:["grupofamiliar","grupo","familia"], rol:["rolenelgrupo","rol","parentesco"]},
    pol: {dni:["dnicuitdelasegurado","dnicuit","dni","cuit","cuil","documento"], ramo:["ramo"], cia:["compania","aseguradora","cia"], nro:["ndepoliza","nrodepoliza","numerodepoliza","nropoliza","npoliza","poliza"], bien:["bienasegurado","bien","objeto"], sub:["patentedetalle","patente","detalle","dominio"], cob:["cobertura","plan"], prod:["producto","productocomercial","nombredelproducto"], desde:["vigenciadesde","desde","iniciovigencia"], hasta:["vigenciahasta","hasta","vencimiento","finvigencia"], prima:["prima","primadelavigencia","primavigencia","primaneta"], primaAn:["primaanual"], premio:["premio","premiototal","premiodelavigencia","premiovigencia"], premioAn:["premioanual"], com:["comision"], pago:["mediodepago","formadepago","pago"]},
    sin: {nro:["ndepoliza","nrodepoliza","numerodepoliza","nropoliza","npoliza","poliza"], fecha:["fecha","fechadesiniestro","fechadeocurrencia"], tipo:["tipo","causa"], estado:["estado"], monto:["montoreclamado","monto","importe"], nsin:["ndesiniestro","nrodesiniestro","numerodesiniestro"], pagado:["montopagado","pagado"], denuncia:["fechadedenuncia","denuncia"], desc:["descripcion","novedades"]}
  };
  const RAMOS = [["automotor","Automotor"],["autos","Automotor"],["auto","Automotor"],["hogar","Hogar"],["combinadofamiliar","Hogar"],["accidentespersonales","Accidentes pers."],["accidentespers","Accidentes pers."],["ap","Accidentes pers."],["vida","Vida"],["comercio","Comercio"],["integraldecomercio","Comercio"],["art","ART"],["riesgosdeltrabajo","ART"],["motos","Motos"],["moto","Motos"],["caucion","Caución"],["integraldeconsorcio","Consorcio"],["consorcio","Consorcio"],["otros","Otros"]];
  const ramoOf = v => { const n = norm(v); const f = RAMOS.find(r => r[0] === n); return f ? f[1] : clean(v); };
  const pad = n => String(n).padStart(2, "0");
  function dateOf(v){
    if (v == null || v === "") return "";
    if (typeof v === "number" && isFinite(v)) { const ms = Math.round((v - 25569) * 864e5); const d = new Date(ms); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
    if (v instanceof Date && !isNaN(v)) return v.getFullYear() + "-" + pad(v.getMonth() + 1) + "-" + pad(v.getDate());
    const s = String(v).trim(); let m;
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) { let y = +m[3]; if (y < 100) y += y > 50 ? 1900 : 2000; const dd = +m[1], mm = +m[2]; if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return y + "-" + pad(mm) + "-" + pad(dd); }
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + "-" + pad(m[2]) + "-" + pad(m[3]);
    return null;
  }
  function numOf(v){
    if (v == null || v === "") return null;
    if (typeof v === "number") return v;
    let s = String(v).replace(/[^\d,.\-]/g, "");
    if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, "");
    const n = parseFloat(s); return isFinite(n) ? n : null;
  }
  const keyOf = v => clean(v).toUpperCase().startsWith("EJ-") ? "EJ" : String(v == null ? "" : v).replace(/\D/g, "");
  const yes = v => /^(s|si|x|1|true|verdadero)$/.test(norm(v));

  function findSheet(wb, word){ return wb.SheetNames.find(n => norm(n).includes(word)); }
  function table(XLSX, ws, aliases){
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
    let h = rows.findIndex(r => r.some(c => { const n = norm(String(c).replace("*", "")); return Object.values(aliases).some(a => a.includes(n)); }));
    if (h < 0) return {cols:{}, data:[], start:0, missing:Object.keys(aliases)};
    const cols = {};
    rows[h].forEach((c, i) => { const n = norm(String(c).replace("*", "")); for (const [f, a] of Object.entries(aliases)) if (cols[f] == null && a.includes(n)) { cols[f] = i; break; } });
    return {cols, data:rows.slice(h + 1), start:h + 2};
  }
  const get = (row, cols, f) => cols[f] == null ? "" : row[cols[f]];
  const isTip = (row, cols, keyField) => { const k = clean(get(row, cols, keyField)); return k.length > 12 && !/\d/.test(k); };

  function parse(XLSX, wb, existing){
    existing = existing || {clients:[], policies:[]};
    const out = {clients:[], policies:[], claims:[], errors:[], warnings:[], skippedExamples:0};
    const E = (m) => out.errors.push(m), W = (m) => out.warnings.push(m);
    const shC = findSheet(wb, "cliente"), shP = findSheet(wb, "poliza"), shS = findSheet(wb, "siniestro");
    if (!shC && !shP) { E("No encontramos las hojas Clientes ni Pólizas. Usá la planilla de VistaPAS sin cambiar los nombres de las hojas."); return out; }
    const byDni = new Map();
    if (shC) {
      const t = table(XLSX, wb.Sheets[shC], ALIAS.cli);
      if (t.cols.dni == null || t.cols.nombre == null) E("Hoja " + shC + ": faltan las columnas DNI / CUIT o Nombre y apellido.");
      else t.data.forEach((r, i) => {
        const row = t.start + i;
        if (r.every(c => clean(c) === "")) return;
        if (isTip(r, t.cols, "dni")) return;
        const dni = keyOf(get(r, t.cols, "dni")), nombre = clean(get(r, t.cols, "nombre"));
        if (dni === "EJ") { out.skippedExamples++; return; }
        if (!dni) { E("Clientes, fila " + row + ": falta el DNI / CUIT" + (nombre ? " de " + nombre : "") + "."); return; }
        if (!nombre) { E("Clientes, fila " + row + ": falta el nombre del cliente con DNI / CUIT " + dni + "."); return; }
        const nac = dateOf(get(r, t.cols, "nac")), desde = dateOf(get(r, t.cols, "desde"));
        if (nac === null) W("Clientes, fila " + row + ": la fecha de nacimiento de " + nombre + " no se entiende; quedó vacía.");
        if (desde === null) W("Clientes, fila " + row + ": la fecha \"Cliente desde\" de " + nombre + " no se entiende; se usó la fecha de hoy.");
        if (byDni.has(dni)) W("Clientes, fila " + row + ": el DNI / CUIT " + dni + " está repetido; quedó la última fila.");
        const tipo = /prosp/.test(norm(get(r, t.cols, "tipo"))) ? "Prospecto" : "Cliente";
        const canalN = norm(get(r, t.cols, "canal"));
        byDni.set(dni, {dni, nombre, tipo, tel:clean(get(r, t.cols, "tel")), email:clean(get(r, t.cols, "email")), domicilio:clean(get(r, t.cols, "domicilio")), nac:nac || null, desde:desde || null, vivienda:yes(get(r, t.cols, "viv")), canal: canalN.startsWith("llam") || canalN.startsWith("tel") ? "Llamada" : canalN.startsWith("mail") || canalN.startsWith("email") ? "Email" : "WhatsApp", grupo:clean(get(r, t.cols, "grupo")), rol:clean(get(r, t.cols, "rol")) || "Titular"});
      });
    }
    out.clients = [...byDni.values()];
    const known = new Set([...byDni.keys(), ...existing.clients.map(c => c.dni).filter(Boolean)]);
    const byNro = new Map();
    if (shP) {
      const t = table(XLSX, wb.Sheets[shP], ALIAS.pol);
      const need = ["dni","ramo","nro","hasta"].filter(f => t.cols[f] == null);
      if (need.length) E("Hoja " + shP + ": faltan columnas obligatorias (" + need.map(f => ({dni:"DNI / CUIT del asegurado", ramo:"Ramo", nro:"Nº de póliza", hasta:"Vigencia hasta"})[f]).join(", ") + ").");
      else t.data.forEach((r, i) => {
        const row = t.start + i;
        if (r.every(c => clean(c) === "")) return;
        if (isTip(r, t.cols, "dni")) return;
        const dni = keyOf(get(r, t.cols, "dni")), nroRaw = clean(get(r, t.cols, "nro"));
        if (dni === "EJ" || nroRaw.toUpperCase().startsWith("EJ-")) { out.skippedExamples++; return; }
        if (!nroRaw) { E("Pólizas, fila " + row + ": falta el Nº de póliza."); return; }
        if (!dni) { E("Pólizas, fila " + row + ": la póliza " + nroRaw + " no tiene DNI / CUIT del asegurado."); return; }
        if (!known.has(dni)) { E("Pólizas, fila " + row + ": la póliza " + nroRaw + " es del DNI / CUIT " + dni + ", que no está en la hoja Clientes."); return; }
        const hasta = dateOf(get(r, t.cols, "hasta"));
        if (!hasta) { E("Pólizas, fila " + row + ": la póliza " + nroRaw + " no tiene una fecha de Vigencia hasta válida (dd/mm/aaaa)."); return; }
        const ramo = ramoOf(get(r, t.cols, "ramo"));
        if (!ramo) { E("Pólizas, fila " + row + ": la póliza " + nroRaw + " no tiene ramo."); return; }
        const desde0 = dateOf(get(r, t.cols, "desde")), plazo = desde0 ? Math.max(1, Math.round((new Date(hasta) - new Date(desde0)) / (30.44 * 864e5))) : 12;
        let prima = numOf(get(r, t.cols, "prima")); if (prima == null){ const pa = numOf(get(r, t.cols, "primaAn")); if (pa != null) prima = Math.round(pa * plazo / 12); }
        let premio = numOf(get(r, t.cols, "premio")); if (premio == null){ const pa = numOf(get(r, t.cols, "premioAn")); if (pa != null) premio = Math.round(pa * plazo / 12); }
        if (prima == null) { W("Pólizas, fila " + row + ": la póliza " + nroRaw + " no tiene prima; quedó en $ 0."); prima = 0; }
        let com = numOf(get(r, t.cols, "com")); if (com != null && com > 1) com = com / 100;
        if (byNro.has(nroRaw)) W("Pólizas, fila " + row + ": el Nº de póliza " + nroRaw + " está repetido; quedó la última fila.");
        const desde = dateOf(get(r, t.cols, "desde"));
        byNro.set(nroRaw, {dni, nro:nroRaw, ramo, cia:clean(get(r, t.cols, "cia")) || "Sin compañía", bien:clean(get(r, t.cols, "bien")) || "—", bienSub:clean(get(r, t.cols, "sub")), cob:clean(get(r, t.cols, "cob")) || "—", prod:clean(get(r, t.cols, "prod")), desde:desde || null, hasta, prima, premio:premio == null ? "" : premio, com, pago:clean(get(r, t.cols, "pago"))});
      });
    }
    out.policies = [...byNro.values()];
    const knownPol = new Set([...byNro.keys(), ...existing.policies.map(p => p.nro)]);
    if (shS) {
      const t = table(XLSX, wb.Sheets[shS], ALIAS.sin);
      if (t.cols.nro != null && t.cols.fecha != null) t.data.forEach((r, i) => {
        const row = t.start + i;
        if (r.every(c => clean(c) === "")) return;
        if (isTip(r, t.cols, "nro")) return;
        const nro = clean(get(r, t.cols, "nro"));
        if (nro.toUpperCase().startsWith("EJ-")) { out.skippedExamples++; return; }
        if (!knownPol.has(nro)) { W("Siniestros, fila " + row + ": la póliza " + nro + " no está cargada; el siniestro se omitió."); return; }
        const fecha = dateOf(get(r, t.cols, "fecha"));
        if (!fecha) { W("Siniestros, fila " + row + ": fecha inválida; el siniestro se omitió."); return; }
        out.claims.push({nro, fecha, tipo:clean(get(r, t.cols, "tipo")) || "Siniestro", estado:clean(get(r, t.cols, "estado")) || "Denunciado", monto:numOf(get(r, t.cols, "monto")) || 0, nsin:clean(get(r, t.cols, "nsin")), pagado:numOf(get(r, t.cols, "pagado")) || 0, denuncia:dateOf(get(r, t.cols, "denuncia")) || fecha, desc:clean(get(r, t.cols, "desc"))});
      });
    }
    return out;
  }
  return {parse, dateOf, numOf, norm};
})();
/*IMPORTER-END*/
</script>

<script>
(function(){

/* ---------- Capa de datos ----------
  Único punto de acceso al almacenamiento. El CRM trabaja sobre el objeto S en memoria y llama a save();

  · Fechas de negocio: texto "AAAA-MM-DD". Importes: número, en pesos. Porcentajes de comisión: ver cada campo.

const SCHEMA_V = 2;
const SCHEMA = {
  clients:{l:"Clientes", f:"nombre, tipo (Cliente | Prospecto), dni, cuit (CUIT o CUIL, de ARCA), tel, email, domicilio, nac (fecha), canal (WhatsApp | Llamada | Email), vivienda (sí/no), segmento (A | B | C), desde (fecha), cuenta (→ grupo familiar), rol, nps (0 a 10), ref (→ clients: quién lo recomendó), refTxt (recomendado por alguien que no es cliente), pago {tarjetas [{id, marca, ult4, venc (MM/AA), titular, banco, enc (número cifrado)}], cuentas [{id, banco, titular, alias, ult4, enc (CBU cifrado)}]}, uif {riesgo (Bajo | Medio | Alto), pep (No | Sí), pepFecha, so (sujeto obligado: No | Sí), actividad, origen (origen de los fondos), revisada (fecha), notas}, color, ini"},

};
const ACCOUNT_DOC = "me {nombre, matricula}, groups {id: nombre}, settings {renov, avisos, cobr, norma, metas}, notices {clave: {at, how}}, demo, versiones de migración";
const COLLS = Object.keys(SCHEMA);
const isoNow = () => new Date().toISOString();
const recSig = r => { const o = Object.assign({}, r); delete o.updatedAt; return JSON.stringify(o); };
const docOf = st => { const o = {}; for (const k in st) if (!SCHEMA[k] && k !== "updatedAt") o[k] = st[k]; return o; };

/* IndexedDB para los archivos del navegador */
let idbP = null;
function getIDB(){
  if (!idbP) idbP = new Promise(res => { try { const r = indexedDB.open("micarterapas-files", 1); r.onupgradeneeded = () => r.result.createObjectStore("files", {keyPath:"id"}); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); } catch(e){ res(null); } });
  return idbP;
}
/* Store del navegador. Interfaz que tiene que cumplir cualquier store:
   read()  → estado completo (o null si no hay datos). Puede devolver una promesa (load()).
   write(state, cambios) → true/false o promesa. cambios = {upsert:{coleccion:[registros]}, remove:{coleccion:[ids]}, doc:{…}|null, n}
   files.put(rec) / files.del(id) / files.all() → archivos {id, name, type, size, blob} */
const LocalStore = {
  kind:"local", label:"este navegador",
  read(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } },
  write(state){ try { localStorage.setItem(KEY, JSON.stringify(state)); return true; } catch(e){ return false; } },
  files:{

    async all(){ const db = await getIDB(); if (!db) return []; return new Promise(res => { try { const q = db.transaction("files").objectStore("files").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch(e){ res([]); } }); }

/* Ejemplo de store para un servidor (no está activo). Endpoints sugeridos:
   GET  {base}/estado          → {cuenta:{…documento de la cuenta}, clients:[…], policies:[…], …}
   POST {base}/cambios         → recibe los cambios (ver interfaz). Responde 200 si los guardó.
   PUT  {base}/archivos/{id}   → sube un archivo · DELETE {base}/archivos/{id} · GET {base}/archivos → lista
   Activación: DB.use(ServerStore("https://api.tu-dominio.com", token)) antes de boot(). */
function ServerStore(base, token){
  const H = {"Content-Type":"application/json", "Authorization":"Bearer " + token};
  let queue = Promise.resolve(true);
  return {
    kind:"server", label:"el servidor",
    load: () => fetch(base + "/estado", {headers:H}).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(x => { const st = Object.assign({}, x.cuenta || {}); COLLS.forEach(c => { st[c] = Array.isArray(x[c]) ? x[c] : []; }); return st; }),
    write: (state, ch) => { if (!ch.n) return true; const body = JSON.stringify(ch); queue = queue.then(() => fetch(base + "/cambios", {method:"POST", headers:H, body}).then(r => r.ok, () => false)); return queue; },
    files:{
      put: rec => fetch(base + "/archivos/" + encodeURIComponent(rec.id) + "?name=" + encodeURIComponent(rec.name || "") + "&type=" + encodeURIComponent(rec.type || ""), {method:"PUT", headers:{"Authorization":H.Authorization}, body:rec.blob}).then(r => r.ok, () => false),
      del: id => fetch(base + "/archivos/" + encodeURIComponent(id), {method:"DELETE", headers:{"Authorization":H.Authorization}}).catch(() => {}),
      all: () => fetch(base + "/archivos", {headers:H}).then(r => r.ok ? r.json() : [], () => [])
    }
  };
}
const DB = {
  store:LocalStore, snap:null, docSnap:"", failAt:0,
  use(store){ this.store = store; },
  /* Toma una foto del estado para comparar en el próximo save() */
  prime(state){
    this.snap = {};
    COLLS.forEach(c => { const m = new Map(); (state[c] || []).forEach(r => { if (r && r.id) m.set(r.id, recSig(r)); }); this.snap[c] = m; });
    this.docSnap = JSON.stringify(docOf(state));
  },
  /* Detecta altas, cambios y bajas; sella createdAt / updatedAt */
  diff(state){
    if (!this.snap) this.prime({});
    const now = isoNow(), ch = {upsert:{}, remove:{}, doc:null, n:0};
    COLLS.forEach(c => {
      const list = state[c]; if (!Array.isArray(list)) return;
      const prev = this.snap[c] || new Map(), next = new Map();
      list.forEach(r => {
        if (!r || typeof r !== "object") return;
        if (!r.id) r.id = nid(c.slice(0, 2));
        const was = prev.get(r.id);
        if (!r.createdAt) r.createdAt = now;
        const sg = recSig(r);
        if (was !== sg){ r.updatedAt = now; (ch.upsert[c] = ch.upsert[c] || []).push(r); ch.n++; }
        next.set(r.id, sg);
      });
      prev.forEach((v, id) => { if (!next.has(id)){ (ch.remove[c] = ch.remove[c] || []).push(id); ch.n++; } });
      this.snap[c] = next;
    });
    const ds = JSON.stringify(docOf(state));
    if (ds !== this.docSnap){ state.updatedAt = now; ch.doc = docOf(state); ch.n++; this.docSnap = ds; }
    return ch;
  },
  save(state){
    const ch = this.diff(state); let r;
    try { r = this.store.write(state, ch); } catch(e){ r = false; }
    Promise.resolve(r).then(ok => { if (ok === false) this.fail(); }, () => this.fail());
    return ch;
  },
  fail(){ if (Date.now() - this.failAt < 6e4) return; this.failAt = Date.now(); setTimeout(() => toast("No se pudieron guardar los últimos cambios. Revisá el espacio en Configuraciones → Almacenamiento."), 0); },
  /* Exporta el esquema para el equipo que arme la base de datos del servidor */
  schema(){ return {version:SCHEMA_V, cuenta:ACCOUNT_DOC, colecciones:Object.fromEntries(COLLS.map(c => [c, {nombre:SCHEMA[c].l, campos:"id, createdAt, updatedAt, " + SCHEMA[c].f}]))}; }
};
/* Normaliza lo que viene del store */
function normalize(x){ if (!x || typeof x !== "object") return null; if (!x.me) x.me = {nombre:""}; if (x.demo === undefined) x.demo = true; return x; }

/* ---------- Cuentas en la nube (Supabase) ----------
  Si window.MICARTERA_CONFIG trae supabaseUrl y supabaseAnonKey, el CRM pide iniciar sesión y guarda todo en la cuenta
  del productor (base de datos + archivos en Supabase). Sin esa configuración funciona como hasta ahora, en el navegador.
  Esquema de la base: supabase/esquema.sql. Guía de puesta en marcha: LEEME.md.
  · Tablas: accounts (documento de la cuenta y plan) y records (un registro por fila: coll, id, data jsonb, deleted).
  · Archivos: bucket privado "archivos", carpeta = id del usuario. Sus datos (nombre, tipo) van en records con coll "_files".
  · Cada usuario solo ve sus filas (Row Level Security). Los cambios se mandan en segundo plano; si no hay conexión
    quedan en cola en este dispositivo y se suben al reconectar. Al volver a la pestaña se traen los cambios de otros dispositivos. */
const CFG = window.MICARTERA_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const BUCKET = "archivos";
const SB = {
  url:String(CFG.supabaseUrl || "").replace(/\/+$/, ""), key:CFG.supabaseAnonKey || "", sess:null, SKEY:"micarterapas.session",
  loadSess(){ try { this.sess = JSON.parse(localStorage.getItem(this.SKEY)) || null; } catch(e){ this.sess = null; } },
  setSess(s){
    if (s && s.access_token){ s.expires_at = s.expires_at || Math.floor(Date.now() / 1000) + (Number(s.expires_in) || 3600); if (!s.user && this.sess && this.sess.user) s.user = this.sess.user; this.sess = s; try { localStorage.setItem(this.SKEY, JSON.stringify(s)); } catch(e){} }
    else { this.sess = null; try { localStorage.removeItem(this.SKEY); } catch(e){} }
  },
  uid(){ return this.sess && this.sess.user ? this.sess.user.id : ""; },
  email(){ return this.sess && this.sess.user ? this.sess.user.email : ""; },
  async auth(path, body, method, withToken){
    const h = {apikey:this.key, "Content-Type":"application/json"}; if (withToken) h.Authorization = "Bearer " + await this.token();
    const r = await fetch(this.url + "/auth/v1/" + path, {method:method || "POST", headers:h, body:body ? JSON.stringify(body) : undefined});
    const j = await r.json().catch(() => ({})); if (!r.ok) throw sbErr(j, r.status); return j;
  },
  async refresh(){
    if (!this.sess || !this.sess.refresh_token) throw sbErr({message:"Sesión vencida"}, 401);
    const r = await fetch(this.url + "/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:{apikey:this.key, "Content-Type":"application/json"}, body:JSON.stringify({refresh_token:this.sess.refresh_token})});
    const j = await r.json().catch(() => ({})); if (!r.ok){ if (r.status >= 400 && r.status < 500) this.setSess(null); throw sbErr(j, r.status); }
    this.setSess(j);
  },
  async token(){ if (!this.sess) throw sbErr({message:"Sin sesión"}, 401); if (this.sess.expires_at - 60 < Date.now() / 1000) await this.refresh(); return this.sess.access_token; },
  async req(path, opt, retried){
    opt = opt || {}; const t = await this.token();
    const r = await fetch(this.url + path, Object.assign({}, opt, {headers:Object.assign({apikey:this.key, Authorization:"Bearer " + t}, opt.headers || {})}));
    if (r.status === 401 && !retried){ await this.refresh(); return this.req(path, opt, true); }
    if (!r.ok){ const j = await r.json().catch(() => ({})); throw sbErr(j, r.status); }
    return r;
  },
  async json(path, opt){ const r = await this.req(path, opt); const t = await r.text(); return t ? JSON.parse(t) : null; }
};
function sbErr(j, st){ const e = new Error(j.error_description || j.msg || j.message || j.error || ("Error " + st)); e.status = st; e.code = j.error_code || j.code || ""; return e; }
function sbMsg(e){
  const m = String(e && e.message || ""), c = String(e && e.code || "");
  if (!e || !e.status) return "No hay conexión con el servidor. Revisá tu internet y probá de nuevo.";
  if (c === "invalid_credentials" || /invalid login/i.test(m)) return "El email o la contraseña no son correctos.";
  if (c === "email_not_confirmed" || /not confirmed/i.test(m)) return "Todavía no confirmaste tu email. Buscá el mensaje que te mandamos (revisá también el correo no deseado).";
  if (c === "user_already_exists" || /already registered|already exists/i.test(m)) return "Ya hay una cuenta con ese email. Probá ingresar o recuperar la contraseña.";
  if (c === "weak_password" || /password should be|weak/i.test(m)) return "La contraseña es muy débil: usá al menos 8 caracteres, con letras y números.";
  if (c === "over_email_send_rate_limit" || e.status === 429) return "Hiciste muchos intentos seguidos. Esperá unos minutos y volvé a probar.";
  if (c === "same_password") return "La nueva contraseña tiene que ser distinta de la anterior.";
  if (e.status === 401 || e.status === 403) return "Tu sesión venció. Ingresá de nuevo.";
  return "No se pudo completar: " + m;
}
const jget = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const inList = ids => "(" + ids.map(x => '"' + String(x).replace(/"/g, "") + '"').join(",") + ")";
async function poolRun(items, n, f){ const q = items.slice(); await Promise.all(Array.from({length:Math.min(n, q.length)}, async () => { while (q.length) await f(q.shift()); })); }

const SupaStore = {
  kind:"cloud", label:"tu cuenta", outbox:[], lastSync:"", status:"ok", lastErr:"", account:null, flushing:null, timer:0,
  okey(){ return "micarterapas.outbox." + SB.uid(); }, ckey(){ return "micarterapas.cache." + SB.uid(); },
  async load(){
    this.outbox = jget(this.okey()) || [];
    if (this.outbox.length) await this.flush();
    if (this.outbox.length){ const c = jget(this.ckey()); if (c){ this.status = "offline"; return c; } }
    const acc = ((await SB.json("/rest/v1/accounts?select=*")) || [])[0] || null;
    this.account = acc;
    const st = Object.assign({}, acc && acc.doc || {}); COLLS.forEach(c => { st[c] = []; });
    let off = 0, max = acc ? acc.updated_at || "" : "", n = 0;
    for (;;){
      const rows = await SB.json(`/rest/v1/records?select=coll,id,data,updated_at&deleted=is.false&coll=neq._files&order=coll.asc,id.asc&limit=1000&offset=${off}`) || [];
      rows.forEach(x => { if (Array.isArray(st[x.coll]) && x.data) st[x.coll].push(x.data); if (x.updated_at > max) max = x.updated_at; n++; });
      if (rows.length < 1000) break; off += 1000;
    }
    this.lastSync = max || "1970-01-01T00:00:00Z"; this.status = "ok";
    st.__empty = !n && !(acc && acc.doc && Object.keys(acc.doc).length);
    return st;
  },
  write(state, ch){
    if (!ch.n) return true;
    COLLS.forEach(c => {
      const up = (ch.upsert[c] || []).map(r => JSON.parse(JSON.stringify(r))); if (up.length) this.outbox.push({t:"up", c, rows:up});
      const rm = ch.remove[c] || []; if (rm.length) this.outbox.push({t:"del", c, ids:rm.slice()});
    });
    if (ch.doc) this.outbox.push({t:"doc", doc:JSON.parse(JSON.stringify(ch.doc))});
    jset(this.okey(), this.outbox); jset(this.ckey(), state);
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 400);
    syncNote();
    return true;
  },
  async send(op){
    const uid = SB.uid(), H = {"Content-Type":"application/json", Prefer:"return=minimal"};
    if (op.t === "up") for (let i = 0; i < op.rows.length; i += 400){
      const body = op.rows.slice(i, i + 400).map(r => ({user_id:uid, coll:op.c, id:r.id, data:r, deleted:false}));
      await SB.req("/rest/v1/records?on_conflict=user_id,coll,id", {method:"POST", headers:Object.assign({}, H, {Prefer:"resolution=merge-duplicates,return=minimal"}), body:JSON.stringify(body)});
    }
    if (op.t === "del") for (let i = 0; i < op.ids.length; i += 150) await SB.req(`/rest/v1/records?coll=eq.${encodeURIComponent(op.c)}&id=in.${encodeURIComponent(inList(op.ids.slice(i, i + 150)))}`, {method:"PATCH", headers:H, body:JSON.stringify({deleted:true})});
    if (op.t === "doc") await SB.req(`/rest/v1/accounts?user_id=eq.${uid}`, {method:"PATCH", headers:H, body:JSON.stringify({doc:op.doc, nombre:(op.doc.me || {}).nombre || ""})});
  },
  flush(){
    if (this.flushing) return this.flushing;

      while (this.outbox.length){
        this.status = "saving"; syncNote();
        try { await this.send(this.outbox[0]); }
        catch(e){
          if (e.status && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 408 && e.status !== 429){ console.error("Cambio rechazado por el servidor", e, this.outbox[0]); this.lastErr = e.message; }

      }

  async pull(){

    const rows = [], newFiles = []; let off = 0, max = this.lastSync;
    for (;;){ const r = await SB.json(`/rest/v1/records?select=coll,id,data,deleted,updated_at&updated_at=gt.${since}&order=updated_at.asc&limit=1000&offset=${off}`) || []; rows.push(...r); if (r.length < 1000) break; off += 1000; }
    const acc = ((await SB.json(`/rest/v1/accounts?select=*&updated_at=gt.${since}`)) || [])[0] || null;
    if (this.outbox.length) return false;
    let changed = false;
    rows.forEach(x => {
      if (x.updated_at > max) max = x.updated_at;
      if (x.coll === "_files"){ if (!x.deleted && !FILES.has(x.id)) newFiles.push(x.data); return; }
      const list = S[x.coll]; if (!Array.isArray(list)) return;
      const i = list.findIndex(r => r.id === x.id);
      if (x.deleted){ if (i >= 0){ list.splice(i, 1); changed = true; } return; }
      if (i < 0 || recSig(list[i]) !== recSig(x.data)){ if (i >= 0) list[i] = x.data; else list.push(x.data); changed = true; }
    });
    if (acc){ if (acc.updated_at > max) max = acc.updated_at; this.account = acc; if (acc.doc){ const before = JSON.stringify(docOf(S)); Object.assign(S, acc.doc); if (JSON.stringify(docOf(S)) !== before) changed = true; } }
    this.lastSync = max;
    for (const meta of newFiles){ try { const rec = await this.files.get(meta); if (rec) FILES.set(rec.id, rec); } catch(e){} }
    if (changed){ DB.prime(S); jset(this.ckey(), S); ntCache = null; cuCache = null; if (!$("#modal-root").innerHTML) render(); }
    return changed;
  },
  files:{
    path:id => `${SB.uid()}/${encodeURIComponent(id)}`,
    async put(rec){
      const blob = rec.blob || (rec.dataUrl ? dataUrlToBlob(rec.dataUrl) : null); if (!blob) return false;
      try {
        await SB.req(`/storage/v1/object/${BUCKET}/${SupaStore.files.path(rec.id)}`, {method:"POST", headers:{"x-upsert":"true", "Content-Type":blob.type || "application/octet-stream"}, body:blob});

        await SB.req("/rest/v1/records?on_conflict=user_id,coll,id", {method:"POST", headers:{"Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify([{user_id:SB.uid(), coll:"_files", id:rec.id, data:meta, deleted:false}])});

    },
    async del(id){
      try { await SB.req(`/storage/v1/object/${BUCKET}/${SupaStore.files.path(id)}`, {method:"DELETE"}); } catch(e){}
      try { await SB.req(`/rest/v1/records?coll=eq._files&id=eq.${encodeURIComponent(id)}`, {method:"PATCH", headers:{"Content-Type":"application/json", Prefer:"return=minimal"}, body:JSON.stringify({deleted:true})}); } catch(e){}
    },
    async get(meta){
      const r = await SB.req(`/storage/v1/object/authenticated/${BUCKET}/${SupaStore.files.path(meta.id)}`);
      const blob = await r.blob(), rec = {id:meta.id, name:meta.name, type:meta.type, size:meta.size || blob.size};
      if (meta.type === "image") rec.dataUrl = await readURL(blob); else rec.blob = new Blob([blob], {type:meta.mime || blob.type});
      return rec;
    },
    async all(){
      const metas = []; let off = 0;
      for (;;){ const r = await SB.json(`/rest/v1/records?select=data&coll=eq._files&deleted=is.false&limit=1000&offset=${off}`) || []; r.forEach(x => metas.push(x.data)); if (r.length < 1000) break; off += 1000; }
      const out = []; await poolRun(metas, 4, async m => { try { out.push(await SupaStore.files.get(m)); } catch(e){} });
      return out;
    }
  }
};

/* Estado del guardado (pie de página y cuenta) */
function syncText(){
  if (!CLOUD) return S && S.demo ? "Todo queda guardado solo en este navegador." : "Tu cartera se guarda en este navegador.";
  const n = SupaStore.outbox.length, st = SupaStore.status;
  if (st === "offline") return `Sin conexión: ${n} ${n === 1 ? "cambio se sube" : "cambios se suben"} cuando vuelva internet.`;
  if (st === "auth") return "Tu sesión venció: ingresá de nuevo para terminar de guardar.";
  if (st === "saving" || n) return "Guardando en tu cuenta…";
  if (st === "error") return "Algún cambio no se pudo guardar. Revisá tu conexión y volvé a intentarlo.";
  return "Guardado en tu cuenta.";
}

function authHide(){ const el = document.getElementById("auth"); if (el) el.remove(); document.body.classList.remove("auth-on"); }
document.addEventListener("click", e => {
  const b = e.target.closest("#auth [data-au]"); if (!b) return;
  const em = (document.getElementById("au-em") || {}).value || "", a = b.dataset.au;
  if (a === "retry") return cloudStart();
  if (a === "logout") return cloudLogout(true);
  authScreen(a, em ? {email:em} : null);
});
async function authSubmit(mode, fd, f){
  const go = f.querySelector(".au-go"), email = String(fd.get("email") || "").trim().toLowerCase(), pw = String(fd.get("password") || "");
  const fail = (text) => authScreen(mode, {err:true, text, email, nombre:String(fd.get("nombre") || "")});
  if (mode !== "reset" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Revisá el email.");
  if ((mode === "signup" || mode === "reset") && (pw.length < 8 || !/[a-z]/i.test(pw) || !/\d/.test(pw))) return fail("La contraseña tiene que tener al menos 8 caracteres, con letras y números.");
  if ((mode === "signup" || mode === "reset") && pw !== fd.get("password2")) return fail("Las contraseñas no coinciden.");
  if (mode === "signup" && !fd.get("ok")) return fail("Para crear la cuenta tenés que aceptar los términos.");
  go.disabled = true; go.textContent = "Un momento…";
  try {
    if (mode === "login"){ SB.setSess(await SB.auth("token?grant_type=password", {email, password:pw})); return cloudStart(); }
    if (mode === "signup"){
      const j = await SB.auth("signup?redirect_to=" + encodeURIComponent(authRedirect()), {email, password:pw, data:{nombre:String(fd.get("nombre") || "").trim()}});
      if (j.access_token){ SB.setSess(j); return cloudStart(); }
      return authScreen("sent", {text:`Te mandamos un email a ${email} para confirmar tu cuenta. Tocá el link del mensaje y vas a entrar directo. Si no lo ves, revisá el correo no deseado.`, email});
    }
    if (mode === "forgot"){ await SB.auth("recover?redirect_to=" + encodeURIComponent(authRedirect()), {email}); return authScreen("sent", {text:`Si ${email} tiene una cuenta, le llega un email con el link para elegir una contraseña nueva.`, email}); }
    if (mode === "reset"){ await SB.auth("user", {password:pw}, "PUT", true); toast("Contraseña actualizada"); return cloudStart(); }
  } catch(e){ fail(sbMsg(e)); }
}
/* Links de los emails (confirmación y recuperación) vuelven con la sesión en el #hash */
function authFromHash(){
  const h = location.hash || ""; if (!/access_token=|error_description=/.test(h)) return null;
  const p = new URLSearchParams(h.slice(1));
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
  if (p.get("error_description")) return {error:p.get("error_description").replace(/\+/g, " ")};
  SB.setSess({access_token:p.get("access_token"), refresh_token:p.get("refresh_token"), expires_in:Number(p.get("expires_in")) || 3600, token_type:"bearer", user:null});
  return {type:p.get("type") || ""};
}
async function cloudStart(){
  const hs = authFromHash();
  if (hs && hs.error){ SB.setSess(null); return authScreen("login", {err:true, text:/expired|invalid/i.test(hs.error) ? "El link venció o ya se usó. Pedí uno nuevo." : hs.error}); }
  if (!SB.sess) return authScreen("login");
  authScreen("loading");
  try {
    if (!SB.sess.user){ const u = await SB.auth("user", null, "GET", true); SB.setSess(Object.assign({}, SB.sess, {user:u})); }
    if (hs && hs.type === "recovery") return authScreen("reset");
    const st = await DB.store.load();
    const empty = st.__empty; delete st.__empty;
    const meta = (SB.sess.user && SB.sess.user.user_metadata) || {};
    const state = empty ? Object.assign(blank(), {me:{nombre:meta.nombre || ""}}) : Object.assign(blank(), st);
    authHide();
    boot(state);
    if (empty) offerLocalUpload();
  } catch(e){
    if (e.status === 401){ SB.setSess(null); return authScreen("login", {err:true, text:"Tu sesión venció. Ingresá de nuevo."}); }
    const c = jget(SupaStore.ckey());
    if (c && !e.status){ authHide(); SupaStore.status = "offline"; boot(Object.assign(blank(), c)); toast("Sin conexión: estás viendo lo último guardado en este dispositivo"); return; }
    authScreen("error", {err:true, text:sbMsg(e)});
  }
}

async function cloudLogout(force){
  if (!force && SupaStore.outbox.length){ toast("Esperá a que termine de guardar antes de cerrar la sesión"); SupaStore.flush(); return; }
  try { await SB.auth("logout", {}, "POST", true); } catch(e){}
  try { localStorage.removeItem(SupaStore.ckey()); localStorage.removeItem(SupaStore.okey()); } catch(e){}
  SB.setSess(null); location.reload();
}

function lum(h){ const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4)); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }

function deleteClients(ids){
  ids.forEach(id => {
    const c = cli(id); if (!c) return;
    const pols = S.policies.filter(p => p.cli === id), pid = new Set(pols.map(p => p.id));
    toTrash("cliente", c.nombre, {client:c, policies:pols, claims:S.claims.filter(s => pid.has(s.pol)), opps:S.opps.filter(o => o.cli === id), tasks:S.tasks.filter(t => t.cli === id), acts:S.acts.filter(a => a.cli === id), cobros:(S.cobros || []).filter(x => pid.has(x.pol)), docs:(S.docs || []).filter(x => x.cli === id), group:c.cuenta && S.groups[c.cuenta] ? {id:c.cuenta, name:S.groups[c.cuenta]} : null});
  });
  const set = new Set(ids);
  const polIds = new Set(S.policies.filter(p => set.has(p.cli)).map(p => p.id));
  S.clients = S.clients.filter(c => !set.has(c.id));
  S.policies = S.policies.filter(p => !set.has(p.cli));
  S.claims = S.claims.filter(s => !polIds.has(s.pol));
  S.opps = S.opps.filter(o => !set.has(o.cli));
  S.tasks = S.tasks.filter(t => !set.has(t.cli));
  S.acts = S.acts.filter(a => !set.has(a.cli));
  S.cobros = (S.cobros || []).filter(x => !polIds.has(x.pol));
  S.docs = (S.docs || []).filter(x => !set.has(x.cli));
  const used = new Set(S.clients.map(c => c.cuenta));
  Object.keys(S.groups).forEach(g => { if (!used.has(g)) delete S.groups[g]; });
  ids.forEach(id => selCli.delete(id));
}
function impactOf(ids){
  const set = new Set(ids);
  return {pols:S.policies.filter(p => set.has(p.cli)).length, opps:S.opps.filter(o => set.has(o.cli)).length, tasks:S.tasks.filter(t => set.has(t.cli)).length};
}

/* ---------- Venta cruzada (clientes con un solo ramo) ---------- */
const isSingleRamo = c => c.tipo !== "Prospecto" && new Set(activePols(c.id).map(p => p.ramo)).size === 1;

/* ---------- Compañías ---------- */
function newCia(nombre){ return {id:nid("k"), nombre, cuit:"", codigo:"", ejecutivo:"", tel:"", email:"", web:"", comision:null, ramos:[], activa:true, notas:""}; }
const ciaByName = n => S.cias.find(k => k.nombre.toLowerCase() === String(n || "").toLowerCase());
function ensureCias(){
  if (!Array.isArray(S.cias)) S.cias = [];
  S.policies.forEach(p => { if (p.cia && p.cia !== "Sin compañía" && !ciaByName(p.cia)) S.cias.push(newCia(p.cia)); });
}
function ciaStats(k){ const ps = S.policies.filter(p => p.cia === k.nombre && estado(p).t !== "Vencida" && !p.anulada); return {n:ps.length, prima:ps.reduce((s,p)=>s+primaAnual(p),0)}; }
let ciaFilter = "activas";
function vCias(){
  const all = S.cias.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const list = ciaFilter === "todas" ? all : all.filter(k => ciaFilter === "activas" ? k.activa !== false : k.activa === false);

  return `
  <div class="page-head"><h1>Compañías y productos</h1><button class="btn primary" type="button" data-act="newcia">+ Nueva compañía</button></div>

  </div>
  ${sinCodigo ? `<div class="small" style="margin-bottom:10px;color:var(--fg-2)">${sinCodigo} ${sinCodigo === 1 ? "compañía activa no tiene" : "compañías activas no tienen"} cargado tu código de productor.</div>` : ""}
  <section class="card"><div class="tbl-wrap">
  <table><thead><tr><th style="padding-left:20px">Compañía</th><th>Código de productor</th><th>Contacto comercial</th><th>Ramos</th><th>Pólizas</th><th>Prima anual</th><th>Comisión</th></tr></thead><tbody>
  ${list.map(k => { const st = ciaStats(k); const r = k.ramos || [];
    return `<tr class="click" data-cia="${k.id}">
    <td style="padding-left:20px"><span class="ramo"><span class="rb" style="background:${colorFor(k.nombre)}">${esc(initials(k.nombre))}</span><span>${esc(k.nombre)}${k.activa === false ? ` <span class="chip st" style="margin-left:4px">Inactiva</span>` : ""}<span class="sub" style="font-weight:400">${k.cuit ? "CUIT " + esc(k.cuit) : "Sin CUIT"} · ${(n => n + (n === 1 ? " producto" : " productos"))(S.prods.filter(x => x.cia === k.id).length)}${k.web ? ` · <a class="ext" href="${esc(k.web)}" target="_blank" rel="noopener">Portal ↗</a>` : ""}</span></span></span></td>
    <td class="num">${k.codigo ? esc(k.codigo) : `<span class="small">Sin cargar</span>`}</td>
    <td>${k.ejecutivo ? esc(k.ejecutivo) : "—"}<span class="sub num">${esc([k.tel, k.email].filter(Boolean).join(" · "))}</span></td>
    <td>${r.length ? `<div class="mini-tags">${r.slice(0,4).map(x => `<span class="chip">${esc(x)}</span>`).join("")}${r.length > 4 ? `<span class="chip">+${r.length - 4}</span>` : ""}</div>` : `<span class="small">—</span>`}</td>
    <td class="num">${st.n}</td><td class="num">${money(st.prima)}</td>
    <td class="num">${typeof k.comision === "number" ? k.comision + " %" : "—"}</td></tr>`; }).join("")}
  </tbody></table>${list.length ? "" : `<div class="empty">${all.length ? "Ninguna compañía cumple este filtro." : "Todavía no cargaste compañías. Usá “Nueva compañía” para dar de alta las aseguradoras con las que trabajás."}</div>`}</div></section>`;
}
function ciaModal(id){
  const k = id ? S.cias.find(x => x.id === id) : null;
  const v = k || {nombre:"", ramos:[], activa:true};
  const st = k ? ciaStats(k) : null;
  const total = k ? S.policies.filter(p => p.cia === k.nombre).length : 0;
  const nP = k ? S.prods.filter(x => x.cia === k.id).length : 0;
  modal(`<h2>${k ? esc(k.nombre) : "Nueva compañía"}</h2>

  <div class="field"><label for="k-nom">Nombre de la compañía</label><input id="k-nom" name="nombre" value="${esc(v.nombre)}" placeholder="Nombre comercial de la aseguradora"></div>

  <div class="field"><label for="k-ej">Ejecutivo/a comercial</label><input id="k-ej" name="ejecutivo" value="${esc(v.ejecutivo)}" placeholder="Tu contacto en la compañía"></div>

    const comRaw = String(fd.get("comision") || "").trim().replace(",", ".");
    const comision = comRaw === "" ? null : Number(comRaw);
    if (comision !== null && (!isFinite(comision) || comision < 0 || comision > 100)){ $("#k-com").focus(); toast("La comisión tiene que estar entre 0 y 100"); return false; }
    let web = (fd.get("web") || "").trim();
    if (web && !/^https?:\/\//i.test(web)) web = "https://" + web;
    const data = {nombre, cuit:(fd.get("cuit") || "").trim(), codigo:(fd.get("codigo") || "").trim(), ejecutivo:(fd.get("ejecutivo") || "").trim(), tel:(fd.get("tel") || "").trim(), email:(fd.get("email") || "").trim(), web, comision, diaLiq:Math.min(28, Math.max(1, Math.round(Number(fd.get("diaLiq"))))) || null, ramos:fd.getAll("ramos"), activa:fd.get("activa") !== "0", notas:(fd.get("notas") || "").trim()};
    if (k){
      if (k.nombre !== nombre) S.policies.forEach(p => { if (p.cia === k.nombre) p.cia = nombre; });
      Object.assign(k, data); toast("Compañía actualizada");
    } else { S.cias.push(Object.assign(newCia(nombre), data)); toast("Compañía creada"); }
    save(); render();
  });
  if (k) $("#k-del").addEventListener("click", e => {
    const b = e.currentTarget;
    if (total){ toast(`Tiene ${total} ${total === 1 ? "póliza cargada" : "pólizas cargadas"}: marcala como inactiva`); return; }
    if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = nP ? `Se borran también sus ${nP} productos. ¿Confirmás?` : "Tocá de nuevo para eliminar"; return; }
    toTrash("compania", k.nombre, {cia:k, prods:S.prods.filter(x => x.cia === k.id)});
    S.cias = S.cias.filter(x => x.id !== k.id); S.prods = S.prods.filter(x => x.cia !== k.id); save(); close(); render(); toast("Compañía enviada a la papelera");
  });
  if (k) $("#k-prods").addEventListener("click", () => { close(); prodCia = k.id; prodEst = "todos"; go("productos"); });

/* ---------- Productos ---------- */
let prodCia = "", prodEst = "activos", prodQ = "", prodRamo = "", prodUso = "";
const prodById = id => (S.prods || []).find(x => x.id === id);
const ciaById = id => S.cias.find(k => k.id === id);
const prodCiaName = pr => { const k = ciaById(pr.cia); return k ? k.nombre : "Sin compañía"; };
function prodLabel(id){
  const pr = prodById(id); if (!pr) return "Sin producto";
  const dup = S.prods.filter(x => x.nombre.toLowerCase() === pr.nombre.toLowerCase()).length > 1;
  return pr.nombre + (dup ? " · " + prodCiaName(pr) : "");
}
function prodStats(pr){
  const ps = S.policies.filter(p => p.prod === pr.id && !p.anulada && estado(p).t !== "Vencida");
  const clis = [...new Set(ps.map(p => p.cli))];
  return {n:ps.length, cl:clis.length, clis, prima:ps.reduce((s,p)=>s+primaAnual(p),0)};
}
function comOf(p){
  if (typeof p.com === "number") return p.com;
  const pr = p.prod && prodById(p.prod); if (pr && typeof pr.comision === "number") return pr.comision / 100;
  const k = ciaByName(p.cia); if (k && typeof k.comision === "number") return k.comision / 100;
  return null;
}
function subnav(){
  return `<div class="seg"><button type="button" data-go="companias" class="${view === "companias" ? "on" : ""}" ${view === "companias" ? 'aria-current="page"' : ""}>Compañías <span class="count">${S.cias.length}</span></button><button type="button" data-go="productos" class="${view === "productos" ? "on" : ""}" ${view === "productos" ? 'aria-current="page"' : ""}>Productos <span class="count">${S.prods.length}</span></button></div>`;
}
function vProds(){
  const cias = S.cias.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if (prodCia && !ciaById(prodCia)) prodCia = "";
  let list = S.prods.slice().sort((a,b)=> prodCiaName(a).localeCompare(prodCiaName(b)) || a.nombre.localeCompare(b.nombre));
  if (prodCia) list = list.filter(x => x.cia === prodCia);
  if (prodEst !== "todos") list = list.filter(x => prodEst === "activos" ? x.activo !== false : x.activo === false);
  if (prodRamo) list = list.filter(x => x.ramo === prodRamo);
  if (prodUso) list = list.filter(x => { const n = prodStats(x).n; return prodUso === "con" ? n > 0 : n === 0; });
  if (prodQ.trim()){ const q = fold(prodQ.trim()); list = list.filter(x => fold([x.nombre, x.cob, x.notas, prodCiaName(x)].join(" ")).includes(q)); }
  const anyPF = prodCia || prodRamo || prodUso || prodQ.trim() || prodEst !== "activos";
  const sinProd = S.policies.filter(p => !p.anulada && estado(p).t !== "Vencida" && !(p.prod && prodById(p.prod))).length;
  return `
  <div class="page-head"><h1>Compañías y productos</h1><button class="btn primary" type="button" data-act="newprod">+ Nuevo producto</button></div>
  ${subnav()}
  <div class="filters">
    <input type="search" data-pfq value="${esc(prodQ)}" placeholder="Buscar por nombre o cobertura" aria-label="Buscar productos">
    <select data-pf="cia" aria-label="Filtrar por compañía"><option value="">Todas las compañías</option>${cias.map(k => `<option value="${k.id}" ${prodCia === k.id ? "selected" : ""}>${esc(k.nombre)}</option>`).join("")}</select>
    <select data-pfr aria-label="Filtrar por ramo"><option value="">Todos los ramos</option>${Object.keys(RAMO).map(r => `<option ${prodRamo === r ? "selected" : ""}>${r}</option>`).join("")}</select>
    <select data-pfu aria-label="Filtrar por uso"><option value="">Con y sin pólizas</option><option value="con" ${prodUso === "con" ? "selected" : ""}>Con pólizas vigentes</option><option value="sin" ${prodUso === "sin" ? "selected" : ""}>Sin pólizas vigentes</option></select>
    <select data-pfe aria-label="Filtrar por estado"><option value="activos" ${prodEst === "activos" ? "selected" : ""}>Activos</option><option value="inactivos" ${prodEst === "inactivos" ? "selected" : ""}>Inactivos</option><option value="todos" ${prodEst === "todos" ? "selected" : ""}>Activos e inactivos</option></select>
    ${anyPF ? `<button class="btn ghost sm" type="button" data-act="pfclear">Limpiar filtros</button>` : ""}
    <span class="fcount">${list.length} de ${S.prods.length} productos</span>
  </div>
  ${sinProd ? `<div class="small" style="margin-bottom:10px;color:var(--fg-2)">${sinProd} ${sinProd === 1 ? "póliza vigente no tiene" : "pólizas vigentes no tienen"} producto asignado. Abrila desde la ficha del cliente para asignarlo.</div>` : ""}
  <section class="card"><div class="tbl-wrap">
  <table><thead><tr><th style="padding-left:20px">Producto</th><th>Compañía</th><th>Comisión</th><th>Clientes</th><th>Pólizas</th><th>Prima anual</th></tr></thead><tbody>
  ${list.map(pr => { const st = prodStats(pr); const k = ciaById(pr.cia);
    const com = typeof pr.comision === "number" ? pr.comision + " %" : k && typeof k.comision === "number" ? `${k.comision} % <span class="small">(compañía)</span>` : "—";
    return `<tr class="click" data-prod="${pr.id}">
    <td style="padding-left:20px"><span class="ramo">${ramoBadge(pr.ramo)}<span>${esc(pr.nombre)}${pr.activo === false ? ` <span class="chip st" style="margin-left:4px">Inactivo</span>` : ""}<span class="sub" style="font-weight:400">${esc(pr.ramo)}${pr.cob ? " · " + esc(pr.cob) : ""}</span></span></span></td>
    <td>${esc(prodCiaName(pr))}</td><td class="num">${com}</td><td class="num">${st.cl}</td><td class="num">${st.n}</td><td class="num">${money(st.prima)}</td></tr>`; }).join("")}
  </tbody></table>${list.length ? "" : `<div class="empty">${S.prods.length ? "Ningún producto cumple este filtro." : "Todavía no cargaste productos. Usá “Nuevo producto” para dar de alta lo que vendés de cada compañía."}</div>`}</div></section>`;
}
function prodModal(id){

  modal(`<h2>${pr ? esc(pr.nombre) : "Nuevo producto"}</h2>

  <div class="frow"><div class="field"><label for="pr-cia">Compañía</label><select id="pr-cia" name="cia">${cias.map(k => `<option value="${k.id}" ${k.id === v.cia ? "selected" : ""}>${esc(k.nombre)}</option>`).join("")}</select></div>

  <div class="field"><label for="pr-est">Estado</label><select id="pr-est" name="activo"><option value="1" ${v.activo !== false ? "selected" : ""}>Activo</option><option value="0" ${v.activo === false ? "selected" : ""}>Inactivo</option></select></div></div>
  <div class="small" id="pr-hint"></div>
  <div class="field"><label for="pr-notas">Notas</label><textarea id="pr-notas" name="notas" placeholder="Ej.: requiere inspección previa">${esc(v.notas)}</textarea></div>
  ${pr && st.clis.length ? `<div class="field"><span class="lbl">Clientes con este producto · <button type="button" class="btn ghost sm" id="pr-clis" style="height:auto;padding:0;font-size:13px">Ver en Clientes →</button></span><div class="mini-tags" style="max-width:none">${st.clis.slice(0,12).map(cid => `<button type="button" class="chip" data-cli="${cid}" style="border:0;cursor:pointer">${esc((cli(cid) || {}).nombre || "—")}</button>`).join("")}${st.clis.length > 12 ? `<span class="chip">+${st.clis.length - 12}</span>` : ""}</div></div>` : ""}
  <div class="foot">${pr ? `<button class="btn danger" type="button" id="pr-del" style="margin-right:auto">Eliminar</button>` : ""}<button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">${pr ? "Guardar cambios" : "Crear producto"}</button></div>`, fd => {
    const nombre = (fd.get("nombre") || "").trim(); const cia = fd.get("cia");
    if (!nombre){ $("#pr-nom").focus(); toast("Escribí el nombre del producto"); return false; }
    if (S.prods.some(x => x.cia === cia && x.nombre.toLowerCase() === nombre.toLowerCase() && x !== pr)){ $("#pr-nom").focus(); toast("Esa compañía ya tiene un producto con ese nombre"); return false; }
    const comRaw = String(fd.get("comision") || "").trim().replace(",", ".");
    const comision = comRaw === "" ? null : Number(comRaw);
    if (comision !== null && (!isFinite(comision) || comision < 0 || comision > 100)){ $("#pr-com").focus(); toast("La comisión tiene que estar entre 0 y 100"); return false; }
    const data = {cia, nombre, ramo:fd.get("ramo"), cob:(fd.get("cob") || "").trim(), comision, activo:fd.get("activo") !== "0", notas:(fd.get("notas") || "").trim()};

      Object.assign(pr, data); toast("Producto actualizado");
    } else { S.prods.push(Object.assign({id:nid("pr")}, data)); toast("Producto creado"); }
    save(); render();

  const hint = () => { const k = ciaById($("#pr-cia").value); $("#pr-hint").textContent = k && typeof k.comision === "number" ? `Si dejás la comisión vacía, se usa la de la compañía (${k.comision} %).` : "Si dejás la comisión vacía y la compañía no tiene una por defecto, no se calcula comisión."; };
  hint(); $("#pr-cia").addEventListener("change", hint);
  const pc = $("#pr-clis"); if (pc) pc.addEventListener("click", () => { close(); cf = Object.assign({}, CF0, {prod:pr.id}); go("clientes"); });
  if (pr) $("#pr-del").addEventListener("click", e => {
    const b = e.currentTarget;
    if (total){ toast(`Está en ${total} ${total === 1 ? "póliza" : "pólizas"}: marcalo como inactivo`); return; }
    if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "Tocá de nuevo para eliminar"; return; }
    toTrash("producto", pr.nombre, {prod:pr});
    S.prods = S.prods.filter(x => x.id !== pr.id); save(); close(); render(); toast("Producto enviado a la papelera");
  });
}

function inScope(p, f, est){
