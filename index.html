}
const acc = () => ({sum:0, n:0, cl:new Set(), com:0, sin:0, msin:0});
function accAdd(a, p){ const pa = primaAnual(p); a.sum += pa; a.n++; a.cl.add(p.cli); const c = comOf(p); if (c != null) a.com += pa * c; S.claims.forEach(s => { if (s.pol === p.id){ a.sin++; a.msin += Number(s.monto) || 0; } }); return a; }
function accMerge(a, b){ a.sum += b.sum; a.n += b.n; b.cl.forEach(x => a.cl.add(x)); a.com += b.com; a.sin += b.sin; a.msin += b.msin; return a; }
function accVal(a, m){ return m === "prima" ? a.sum : m === "polizas" ? a.n : m === "clientes" ? a.cl.size : m === "comision" ? a.com : m === "siniestros" ? a.sin : m === "monto_sin" ? a.msin : (a.n ? a.sum / a.n : 0); }
function monthKeys(){ const out = []; for (let i = 0; i < 12; i++){ const t = new Date(TODAY.getFullYear(), TODAY.getMonth() + i, 1); out.push(t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0")); } return out; }
const monthLabel = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("es-AR", {month:"short"}).replace(".", "") + " " + String(y).slice(2); };
function series(def, global){

  const all = acc(); pols.forEach(p => accAdd(all, p));
  if (D.time){
    const keys = monthKeys(), g = {}, tot = acc(); keys.forEach(k => g[k] = acc());
    pols.forEach(p => { const k = (p.hasta || "").slice(0, 7); if (g[k]){ accAdd(g[k], p); accAdd(tot, p); } });
    return {rows:keys.map(k => ({key:k, label:monthLabel(k), value:accVal(g[k], m)})), total:accVal(tot, m), time:true};

const moneyShort = n => n >= 1e6 ? "$ " + (n / 1e6).toLocaleString("es-AR", {maximumFractionDigits:1}) + " M" : n >= 1e3 ? "$ " + Math.round(n / 1e3).toLocaleString("es-AR") + " mil" : "$ " + Math.round(n);
const fmtV = (v, m) => METRICS[m].money ? money(v) : Math.round(v).toLocaleString("es-AR");
const fmtS = (v, m) => METRICS[m].money ? moneyShort(v) : Math.round(v).toLocaleString("es-AR");
const pctS = x => (x * 100).toLocaleString("es-AR", {maximumFractionDigits:1}) + " %";
const tipOf = (label, v, m, total) => esc(label + "|" + fmtV(v, m) + (METRICS[m].add && total ? " · " + pctS(v / total) + " del total" : ""));

  if (file.size > 10e6) throw new Error("La imagen pesa más de 10 MB.");
  if (file.type === "image/gif" || file.size <= 300e3) return readURL(file);
  const url = await readURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("No se pudo leer la imagen.")); i.src = url; });
  const k = Math.min(1, 1200 / img.naturalWidth), cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", .86);
}

function dataUrlToBlob(du){ const [h, b64] = String(du).split(","); const mime = (h.match(/data:([^;]+)/) || [])[1] || "application/octet-stream"; const bin = atob(b64 || ""); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return new Blob([u8], {type:mime}); }

const CAL_L = [

const qRate = q => { const pr = q.prod && prodById(q.prod); if (pr && typeof pr.comision === "number") return pr.comision / 100; const k = ciaByName(q.cia); return k && typeof k.comision === "number" ? k.comision / 100 : null; };
const qSorted = o => (o.quotes || []).slice().sort((a, b) => qPremio(a) - qPremio(b));
function copyText(txt, label){
  const done = () => toast(label ? `Copiado: ${label}` : "Copiado");
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;left:-9999px;top:0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); ok ? done() : toast("No se pudo copiar"); };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e){ fallback(); }
}

function runRenewals(){
  const R = cfg("renov"); if (!R.on) return 0;
  let n = 0;
  S.policies.forEach(p => {
    if (p.anulada || !p.hasta || !cli(p.cli)) return;
    const dd = days(p.hasta);
    if (dd > R.crear || dd < -15 || p.renovKey === p.hasta) return;
    if (renovOf(p)){ p.renovKey = p.hasta; return; }
    const actual = {id:nid("q"), cia:p.cia, prod:p.prod || "", cob:p.cob && p.cob !== "—" ? p.cob : "", prima:Number(p.prima) || 0, premio:premioVig(p), cuota:"", suma:"", franq:"", validez:"", notas:"Precio de la póliza actual", file:"", fecha:isoToday(), elegida:false, actual:true};
    const manual = S.opps.find(o => !o.renov && o.cli === p.cli && o.ramo === p.ramo && isOpen(o) && /renov/i.test((o.origen || "") + " " + o.titulo));
    if (manual){

      if (!Array.isArray(manual.quotes)) manual.quotes = [];

function ntHandle(e){

  if ("ntkind" in b.dataset){ ntKind = b.dataset.ntkind; render(); const x = document.querySelector(`[data-ntkind="${ntKind}"]`); if (x) x.focus(); return true; }
  if (b.dataset.ntundo){ delete S.notices[b.dataset.ntundo]; ntCache = null; save(); render(); toast("El aviso vuelve a la lista"); return true; }
  const n = notices().find(x => x.key === (b.dataset.ntwa || b.dataset.ntopen || b.dataset.ntdone)); if (!n) return true;
  if (b.dataset.ntdone){ noticeDone(n.key, "listo", n.title); save(); render(); toast("Aviso resuelto"); return true; }
  if (b.dataset.ntopen){ close(); noticeOpen(n); return true; }
  if (b.dataset.ntwa){ close(); waModal(n.cli, Object.assign({}, n.wa, {notice:n})); return true; }
  return true;
}

/* Número para wa.me: 549 + característica + número, sin 0 ni 15 */
function waNum(tel){
  let x = String(tel || "").replace(/\D/g, ""); if (x.length < 8) return "";
  if (x.startsWith("54")){ x = x.slice(2); if (x.startsWith("9")) x = x.slice(1); }
  x = x.replace(/^0+/, "");
  if (x.length === 12) for (const a of [2, 3, 4]) if (x.substr(a, 2) === "15"){ x = x.slice(0, a) + x.slice(a + 2); break; }
  return "549" + x;
}

/* ---------- Lectura de planillas (pagos y liquidaciones) ---------- */
function cellNum(v){
  if (typeof v === "number") return v;
  let s = String(v == null ? "" : v).replace(/[^\d,.\-]/g, ""); if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (s.includes(",")) s = s.replace(",", ".");
  else if (/^\-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return Number(s);
}
function cellDate(v){
  if (v instanceof Date && !isNaN(v)) return isoD(v);
  if (typeof v === "number" && v > 20000 && v < 80000){ const t = new Date(Math.round((v - 25569) * 864e5)); return isoD(new Date(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate())); }
  const s = String(v == null ? "" : v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return isoD(new Date(+m[1], m[2] - 1, +m[3]));
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){ const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]); return isoD(new Date(y, m[2] - 1, +m[1])); }
  return "";
}
const hkey = s => fold(s).replace(/[^a-z0-9]/g, "");
function readSheet(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(), isCsv = /\.(csv|txt)$/i.test(file.name);
    fr.onerror = () => rej(new Error("No pudimos abrir el archivo."));
    fr.onload = () => {
      try {
        if (window.XLSX){ const wb = XLSX.read(isCsv ? fr.result : new Uint8Array(fr.result), {type:isCsv ? "string" : "array", cellDates:false}); const ws = wb.Sheets[wb.SheetNames[0]]; return res(XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""})); }
        if (!isCsv) return rej(new Error("No se pudo cargar el lector de Excel. Guardá la planilla como CSV o revisá tu conexión."));
        const lines = String(fr.result).split(/\r?\n/).filter(l => l.trim()), sep = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ";" : ",";
        res(lines.map(l => l.split(sep).map(x => x.replace(/^"|"$/g, "").trim())));
      } catch(e){ rej(new Error("El archivo no parece una planilla válida.")); }
    };
    if (isCsv) fr.readAsText(file); else fr.readAsArrayBuffer(file);
  });
}
/* Busca la fila de encabezados y la columna de cada dato según sus nombres posibles */
function findCols(rows, spec){
  let best = null;
  for (let r = 0; r < Math.min(rows.length, 15); r++){
    const hs = (rows[r] || []).map(hkey), idx = {}; let hits = 0;
    for (const k in spec){ const i = hs.findIndex(h => h && spec[k].some(s => h === s || h.includes(s))); if (i >= 0){ idx[k] = i; hits++; } }
    if (!best || hits > best.hits) best = {h:r, idx, hits};
  }
  return best;
}

/* ---------- Cobranzas: cuotas ---------- */
const CUOTA_EST = {pagada:["Pagada", "green"], debitada:["Debitada", "green"], vencida:["Vencida", "red"], proxima:["Por vencer", "orange"], pendiente:["Pendiente", ""]};
const perOfIso = iso => String(iso).slice(0, 7);
const perLabel = per => { const [y, m] = per.split("-").map(Number); return MESES[m - 1] + " " + y; };
const perAdd = (per, n) => { const [y, m] = per.split("-").map(Number); const t = new Date(y, m - 1 + n, 1); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0"); };
function polCycles(p){

let cuCache = null;
function allCuotas(){
  if (cuCache) return cuCache;
  const byKey = new Map(); (S.cobros || []).forEach(x => { const k = x.pol + "|" + x.ciclo + "|" + x.cuota; (byKey.get(k) || byKey.set(k, []).get(k)).push(x); });

  S.policies.forEach(p => {
    if (!p.hasta) return;
    const medio = p.medio || "debito", since = String(p.createdAt || "").slice(0, 10);
    polCycles(p).forEach(cy => {
      if (!cy.desde || !cy.hasta || cy.hasta <= cy.desde) return;
      const plazo = monthsBetween(cy.desde, cy.hasta), n = Math.max(1, Math.min(24, Math.round(cy.n) || plazo)), step = plazo / n, monto = Math.round(cy.premio / n), primaC = cy.prima / n;
      for (let i = 1; i <= n; i++){

/* ---------- Comisiones: esperado vs. liquidado ---------- */
function espRows(cia, per){ return allCuotas().filter(q => q.cy.cia === cia && q.per === per && cobrada(q) && q.rate != null); }

function liqDue(cia, per){ const k = ciaByName(cia), day = Math.min(28, Math.max(1, Number(k && k.diaLiq) || 10)); const [y, m] = per.split("-").map(Number); return isoD(new Date(y, m, day)); }

  const C = cfg("cobr"), esp = esperado(cia, per), ls = S.liqs.filter(l => l.cia === cia && l.periodo === per), liq = Math.round(ls.reduce((s, l) => s + (Number(l.importe) || 0), 0));
  const due = liqDue(cia, per), tol = Math.max(esp * (Number(C.tol) || 0) / 100, 500);

}

function retention(){
  const a = isoOffset(365), b = isoOffset(15), ren = [], lost = [];
  S.policies.forEach(p => {
    (p.hist || []).forEach(h => { if (h && h.hasta >= a && h.hasta <= b) ren.push({p, hasta:h.hasta}); });
    if (!p.anulada && p.hasta >= a && p.hasta <= b) lost.push(p);
  });
  const n = ren.length + lost.length;
  return {ren, lost, n, rate:n ? ren.length / n : null};
}
/* Comisión proyectada por mes: cuotas de las vigencias actuales + renovaciones estimadas según tu retención */
function projection(){
  const cur = perOfIso(isoToday()), months = Array.from({length:12}, (_, i) => perAdd(cur, i)), last = months[11];
  const vig = Object.fromEntries(months.map(m => [m, 0])), ren = Object.fromEntries(months.map(m => [m, 0]));
  const rt = retention(), r = rt.rate == null ? .8 : rt.rate;
  allCuotas().forEach(q => { if (!q.cy.cur || q.p.anulada || q.rate == null) return; const m = perOfIso(q.vence); if (m in vig && q.est !== "vencida") vig[m] += q.primaC * q.rate; });
  S.policies.forEach(p => {
    if (p.anulada || !p.hasta || days(p.hasta) < -15) return;
    const ro = renovOf(p); if (ro && ro.etapa === "Perdida") return;
    const rate = comOf(p); if (rate == null) return;
    const plazo = polPlazo(p), n = polCuotas(p), step = plazo / n, monto = (Number(p.prima) || 0) / n;
    let desde = p.hasta, k = 0;
    while (perOfIso(desde) <= last && k < 12){ for (let i = 0; i < n; i++){ const m = perOfIso(addM(desde, Math.round(i * step))); if (m in ren) ren[m] += monto * rate * r; } desde = addM(desde, plazo); k++; }
  });
  return {months, vig, ren, r, rt};
}

/* ---------- Datos de pago del cliente (tarjeta, CBU y alias), cifrados con una clave ----------
  El número de tarjeta y el CBU se guardan cifrados (AES-GCM, clave derivada con PBKDF2 de la "clave de datos de pago"
  que elige el productor). Ni el navegador ni el servidor guardan la clave: sin ella esos datos no se pueden leer.
  En claro quedan solo la marca, los últimos 4 números, el vencimiento, el titular, el banco y el alias.
  El código de seguridad (CVV) no se pide ni se guarda nunca. */
const VAULT = {key:null, timer:0};
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function vDerive(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(salt), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
}
async function vEnc(obj, key){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key || VAULT.key, new TextEncoder().encode(JSON.stringify(obj))); return b64e(iv) + "." + b64e(ct); }
async function vDec(str, key){ const [iv, ct] = String(str).split("."); const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(iv)}, key || VAULT.key, b64d(ct)); return JSON.parse(new TextDecoder().decode(pt)); }
function vTouch(){ clearTimeout(VAULT.timer); VAULT.timer = setTimeout(() => { VAULT.key = null; if (view === "cliente") render(); }, 10 * 60e3); }
const vaultOf = () => (S.settings || {}).vault || null;
/* Pide (o crea) la clave y devuelve una promesa que se resuelve cuando está desbloqueado */
function needKey(){
  if (VAULT.key){ vTouch(); return Promise.resolve(true); }
  return new Promise(res => {
    const v = vaultOf();
    if (!v){
      modal(`<h2>Creá tu clave de datos de pago</h2>
      <p class="muted" style="margin:0">Los números de tarjeta y los CBU de tus clientes se guardan cifrados con esta clave. Vas a necesitarla para verlos o copiarlos. <b>Si la olvidás, esos números no se pueden recuperar</b> (los vas a tener que volver a cargar).</p>
      <div class="field"><label for="vk-1">Clave</label><input id="vk-1" name="p1" type="password" autocomplete="new-password"><span class="small">Al menos 6 caracteres. Usá una distinta de la contraseña de tu cuenta.</span></div>
      <div class="field"><label for="vk-2">Repetila</label><input id="vk-2" name="p2" type="password" autocomplete="new-password"></div>
      ${foot("Crear clave")}`, fd => {

  });
  const inp = $("#imp-file"), drop = $("#imp-drop");
  inp.addEventListener("change", () => inp.files[0] && readFile(inp.files[0]));
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));

function readFile(file){
  const prev = $("#imp-prev");
  if (!window.XLSX){ prev.innerHTML = `<div class="issues"><span class="e">No se pudo cargar el lector de Excel. Revisá tu conexión a internet y volvé a abrir la página.</span></div>`; return; }
  prev.innerHTML = `<div class="small">Leyendo ${esc(file.name)}…</div>`;
  const fr = new FileReader();
  fr.onerror = () => { prev.innerHTML = `<div class="issues"><span class="e">No pudimos abrir el archivo. Probá guardarlo de nuevo como .xlsx.</span></div>`; };
  fr.onload = () => {
    let res;
    try { const wb = XLSX.read(new Uint8Array(fr.result), {type:"array"}); res = CarteraImporter.parse(XLSX, wb, {clients:S.clients, policies:S.policies}); }
    catch(e){ prev.innerHTML = `<div class="issues"><span class="e">El archivo no parece una planilla válida. Usá la planilla de VistaPAS en formato .xlsx.</span></div>`; return; }
    const soon = res.policies.filter(p => { const n = days(p.hasta); return n >= 0 && n <= 30; }).length;
    const ok = res.clients.length + res.policies.length > 0;
    pending = ok ? res : null;
    prev.innerHTML = `
      <div class="sum"><div><b>${res.clients.length}</b><span class="small">clientes</span></div><div><b>${res.policies.length}</b><span class="small">pólizas</span></div><div><b>${res.claims.length}</b><span class="small">siniestros</span></div></div>
      ${ok ? `<div class="small" style="color:var(--fg-2)">${soon ? `<b style="color:var(--orange)">${soon} ${soon === 1 ? "póliza vence" : "pólizas vencen"} en los próximos 30 días.</b> ` : ""}${res.skippedExamples ? res.skippedExamples + " filas de ejemplo (EJ-) se ignoraron." : ""}</div>` : `<div class="small" style="color:var(--red)">No encontramos datos para importar${res.skippedExamples ? ": la planilla solo tiene las filas de ejemplo" : ""}.</div>`}
      ${res.errors.length || res.warnings.length ? `<div><div class="small" style="margin-bottom:4px">${res.errors.length ? res.errors.length + " filas no se van a importar" : ""}${res.errors.length && res.warnings.length ? " · " : ""}${res.warnings.length ? res.warnings.length + " avisos" : ""}. Podés corregir la planilla y volver a subirla.</div><div class="issues">${res.errors.map(m => `<span class="e">${esc(m)}</span>`).join("")}${res.warnings.map(m => `<span class="w">${esc(m)}</span>`).join("")}</div></div>` : (ok ? `<div class="small" style="color:var(--green)">Sin errores. Todo listo para importar.</div>` : "")}`;
    const mode = $("#imp-mode"); if (mode) mode.hidden = !ok;
    $("#imp-go").disabled = !ok;
    $("#imp-go").textContent = ok ? `Importar ${res.clients.length} clientes y ${res.policies.length} pólizas` : "Importar";
  };
  fr.readAsArrayBuffer(file);
}
function applyImport(res, mode){
  if (mode === "replace"){ const keep = S.demo ? [] : (S.cias || []), keepP = S.demo ? [] : (S.prods || []), ch = S.charts, tp = S.tpls; S = blank(); S.cias = keep; S.prods = keepP; if (ch) S.charts = ch; if (tp) S.tpls = tp; }
  const today = isoToday();
  const byDni = new Map(S.clients.filter(c => c.dni).map(c => [c.dni, c]));
  const groupByName = new Map(Object.entries(S.groups).map(([id, name]) => [name.toLowerCase(), id]));
  const touched = new Set();
  res.clients.forEach(x => {
    let c = byDni.get(x.dni);
    let gid;
    if (x.grupo){ gid = groupByName.get(x.grupo.toLowerCase()); if (!gid){ gid = nid("g"); S.groups[gid] = x.grupo; groupByName.set(x.grupo.toLowerCase(), gid); } }
    const fields = {dni:x.dni, nombre:x.nombre, ini:initials(x.nombre), tipo:x.tipo, tel:x.tel || "—", email:x.email || "—", domicilio:x.domicilio || "—", nac:x.nac, vivienda:x.vivienda, canal:x.canal, rol:x.rol};
    if (c){ Object.assign(c, fields); if (x.desde) c.desde = x.desde; if (gid) c.cuenta = gid; }
    else {
      if (!gid){ gid = nid("g"); S.groups[gid] = x.nombre; }
      c = Object.assign({id:nid("c"), color:colorFor(x.nombre), segmento:"C", desde:x.desde || today, nps:null, cuenta:gid}, fields);
      S.clients.push(c); byDni.set(x.dni, c);
    }
    touched.add(c.id);
  });
  const byNro = new Map(S.policies.map(p => [p.nro, p]));
  res.policies.forEach(x => {
    const c = byDni.get(x.dni); if (!c) return;
    const fields = {cli:c.id, ramo:x.ramo, cia:x.cia, nro:x.nro, bien:x.bien, bienSub:x.bienSub, cob:x.cob, desde:x.desde, hasta:x.hasta, prima:x.prima, premio:x.premio || "", com:x.com, pago:x.pago};
    { const pg = fold(x.pago || ""); const md = /debito|tarjeta/.test(pg) ? "debito" : /cupon|efectivo|facil|rapipago/.test(pg) ? "cupon" : /transf/.test(pg) ? "transf" : /productor/.test(pg) ? "productor" : ""; if (md) fields.medio = md; }
    const p = byNro.get(x.nro);
    if (p) Object.assign(p, fields); else { const np = Object.assign({id:nid("p")}, fields); S.policies.push(np); byNro.set(x.nro, np); }
    touched.add(c.id);
  });
  ensureCias();
  res.policies.forEach(x => {
    const p = byNro.get(x.nro); if (!p) return; const kc = ciaByName(p.cia); if (!kc) return;
    p.cia = kc.nombre;
    if (x.prod){
      let pr = S.prods.find(q => q.cia === kc.id && q.nombre.toLowerCase() === x.prod.toLowerCase());
      if (!pr){ pr = {id:nid("pr"), cia:kc.id, nombre:x.prod, ramo:p.ramo, cob:p.cob && p.cob !== "—" ? p.cob : "", comision:null, activo:true, notas:""}; S.prods.push(pr); }
      p.prod = pr.id;
    }
    if (p.com == null){ const pr = p.prod && prodById(p.prod); if (pr && typeof pr.comision === "number") p.com = pr.comision / 100; else if (typeof kc.comision === "number") p.com = kc.comision / 100; }
  });
  res.claims.forEach(x => {
    const p = byNro.get(x.nro); if (!p) return;
    if (!S.claims.some(s => s.pol === p.id && s.fecha === x.fecha)) S.claims.push({id:nid("s"), pol:p.id, fecha:x.fecha, denuncia:x.denuncia || x.fecha, tipo:x.tipo, nro:x.nsin || "", estado:x.estado, monto:x.monto, pagado:x.pagado || 0, desc:x.desc || "", hist:[{f:x.denuncia || x.fecha, e:x.estado}]});
  });
  touched.forEach(id => { const c = cli(id); const tot = activePols(id).reduce((s,p)=>s+primaAnual(p),0); c.segmento = c.tipo === "Prospecto" ? "C" : SEG(tot); });
  S.policies.forEach(p => { const n = days(p.hasta); if (n >= 0 && n <= 30 && !S.tasks.some(t => t.pol === p.id)) S.tasks.push({id:nid("t"), cli:p.cli, pol:p.id, txt:"Renovar " + p.ramo.toLowerCase() + " · " + p.bien, due: n > 7 ? isoOffset(-(n - 7)) : today, done:false}); });
  S.demo = false;
  if (S.clients[0]) current = S.clients[0].id;
  save(); go("inicio");
  toast(`Importamos ${res.clients.length} clientes y ${res.policies.length} pólizas`);
}

  if ("pfr" in t.dataset){ prodRamo = t.value; render(); const s = document.querySelector("[data-pfr]"); if (s) s.focus(); }
  if ("pfu" in t.dataset){ prodUso = t.value; render(); const s = document.querySelector("[data-pfu]"); if (s) s.focus(); }
  if ("pfe" in t.dataset){ prodEst = t.value; render(); const s = document.querySelector("[data-pfe]"); if (s) s.focus(); }
  if (t.id === "navc-pick" || t.id === "navc-hex"){ const id = t.id; if (!setNavColor(t.value)) t.value = (P.navColor || "#1b2034").toUpperCase(); else { const el = document.getElementById(id); if (el) el.focus(); } return; }
  if (t.dataset.modloc){
    const id = t.dataset.modloc;
    if (t.value === "more" && !P.more.includes(id)){
      if (P.order.filter(x => !P.more.includes(x)).length <= 1){ t.value = "main"; toast("Tiene que quedar al menos un módulo en el menú principal"); return; }
      P.more.push(id);
    } else if (t.value === "main") P.more = P.more.filter(x => x !== id);
    savePrefs(); render(); const s = document.querySelector(`[data-modloc="${id}"]`); if (s) s.focus();
  }
  if (t.dataset.opp){ setOppStage(S.opps.find(x => x.id === t.dataset.opp), t.value); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal-root").innerHTML) close(); });

/* ---------- Tooltip de gráficos ---------- */
document.body.insertAdjacentHTML("beforeend", `<div class="tip" id="tip" role="tooltip" hidden></div>`);
const tipEl = $("#tip");
function tipShow(el){ const [a, b] = el.dataset.tip.split("|"); tipEl.innerHTML = `<b>${esc(a)}</b><span>${esc(b || "")}</span>`; tipEl.hidden = false; }
function tipAt(x, y){ const w = tipEl.offsetWidth, h = tipEl.offsetHeight; tipEl.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + "px"; tipEl.style.top = (y - h - 12 < 8 ? y + 18 : y - h - 12) + "px"; }
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el) tipShow(el); });
document.addEventListener("mousemove", e => { if (!tipEl.hidden) tipAt(e.clientX, e.clientY); });
document.addEventListener("mouseout", e => { const el = e.target.closest("[data-tip]"); if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) tipEl.hidden = true; });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (!el){ tipEl.hidden = true; return; } tipShow(el); const r = el.getBoundingClientRect(); tipAt(r.left + r.width / 2 - 14, r.top); });
document.addEventListener("scroll", () => { tipEl.hidden = true; }, true);

document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("tpl")){ e.preventDefault(); if (e.target.dataset.wtpl) wtplModal(e.target.dataset.wtpl); else tplModal(e.target.dataset.tpl); } });

/* Búsqueda en vivo de clientes y productos */
document.addEventListener("input", e => {
  const el = e.target; const isS = "sfq" in el.dataset;
  if (isS){ sf.q = el.value; const pos = el.selectionStart; render(); const n = document.querySelector("[data-sfq]"); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(err){} } return; }
  const isC = "cfq" in el.dataset, isP = "pfq" in el.dataset;
  if (!isC && !isP) return;
  if (isC) cf.q = el.value; else prodQ = el.value;
  const pos = el.selectionStart; render();
  const n = document.querySelector(isC ? "[data-cfq]" : "[data-pfq]"); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(err){} }
});

/* Vista previa en vivo del color personalizado */
document.addEventListener("input", e => {
  if (e.target.id === "navc-pick"){ applyNav(e.target.value); const tx = $("#navc-hex"); if (tx) tx.value = e.target.value.toUpperCase(); }

});

/* ---------- Menú "Más" ---------- */
document.addEventListener("click", e => {
  if (e.target.closest("#more-btn")){ toggleMore($("#more-menu").hidden, e.detail === 0); return; }
  if (!e.target.closest("#more-menu") && !$("#more-menu").hidden) toggleMore(false);
});
document.addEventListener("keydown", e => {
  const menu = $("#more-menu");
  if (menu.hidden) { if (e.key === "ArrowDown" && document.activeElement === $("#more-btn")){ e.preventDefault(); toggleMore(true, true); } return; }
  if (e.key === "Escape"){ toggleMore(false); $("#more-btn").focus(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault(); const items = [...menu.querySelectorAll("button")]; const i = items.indexOf(document.activeElement);
    items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
  }
});
let fitRaf = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitNav); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNav);

/* ---------- Arrastrar oportunidades entre etapas ---------- */
function setOppStage(o, st){
  if (!o || !STAGES.includes(st) || o.etapa === st) return false;
  const prev = o.etapa; o.etapa = st;
  if (st === "Ganada") o.prob = 100; if (st === "Perdida") o.prob = 0;
  if (st === "Ganada" || st === "Perdida") o.cerrada = isoToday(); else delete o.cerrada;
  addAct(o.cli, "N", "Oportunidad \"" + o.titulo + "\" pasó de " + prev + " a " + st);
  save(); render(); toast(st === "Ganada" ? "¡Oportunidad ganada!" : st === "Perdida" ? "Oportunidad marcada como perdida" : "Movida a " + st);
  if (st === "Ganada" && o.renov) setTimeout(() => renewModal(o), 0);
  return true;
}
const kb = {card:null, id:null, pid:null, x0:0, y0:0, dx:0, dy:0, ghost:null, on:false, timer:0, over:null, raf:0, lx:0, ly:0};
function kbStart(){
  const r = kb.card.getBoundingClientRect();
  kb.dx = kb.x0 - r.left; kb.dy = kb.y0 - r.top;
  const g = kb.card.cloneNode(true); g.classList.add("opp-ghost"); g.removeAttribute("data-oppcard"); g.style.width = r.width + "px"; g.style.left = r.left + "px"; g.style.top = r.top + "px";
  document.body.appendChild(g); kb.ghost = g; kb.on = true;
  kb.card.classList.add("ph"); document.body.classList.add("dragging-opp");
  if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
}
function kbTarget(x, y){
  if (kb.ghost) kb.ghost.style.display = "none";
  const el = document.elementFromPoint(x, y);
  if (kb.ghost) kb.ghost.style.display = "";
  return el && el.closest("[data-stage]");
}
function kbMove(x, y){
  kb.lx = x; kb.ly = y;
  kb.ghost.style.left = (x - kb.dx) + "px"; kb.ghost.style.top = (y - kb.dy) + "px";
  const t = kbTarget(x, y);
  if (t !== kb.over){ if (kb.over) kb.over.classList.remove("drop-on"); kb.over = t; if (t && t.dataset.stage !== kb.cur) t.classList.add("drop-on"); }
  const board = document.querySelector(".kanban");
  cancelAnimationFrame(kb.raf);
  const edge = 48, step = () => {
    let moved = false;
    if (board){ const r = board.getBoundingClientRect(); if (kb.lx > r.right - edge){ board.scrollLeft += 12; moved = true; } else if (kb.lx < r.left + edge){ board.scrollLeft -= 12; moved = true; } }
    if (kb.ly > innerHeight - edge){ window.scrollBy(0, 12); moved = true; } else if (kb.ly < 70 + edge){ window.scrollBy(0, -12); moved = true; }
    if (moved && kb.on) kb.raf = requestAnimationFrame(step);
  };
  kb.raf = requestAnimationFrame(step);
}
function kbEnd(drop){
  clearTimeout(kb.timer); cancelAnimationFrame(kb.raf);
  const wasOn = kb.on, target = kb.over, id = kb.id;
  if (kb.ghost) kb.ghost.remove();
  if (kb.card) kb.card.classList.remove("ph");
  if (kb.over) kb.over.classList.remove("drop-on");
  document.body.classList.remove("dragging-opp");
  Object.assign(kb, {card:null, id:null, pid:null, ghost:null, on:false, over:null, cur:null});
  if (wasOn && drop && target){ const o = S.opps.find(x => x.id === id); if (o && target.dataset.stage !== o.etapa) setOppStage(o, target.dataset.stage); }
  return wasOn;
}
document.addEventListener("pointerdown", e => {
  if (e.button !== 0 || kb.card) return;
  const card = e.target.closest("[data-oppcard]");
  if (!card || e.target.closest("select,button,a,input")) return;
  const o = S.opps.find(x => x.id === card.dataset.oppcard); if (!o) return;
  Object.assign(kb, {card, id:o.id, cur:o.etapa, pid:e.pointerId, x0:e.clientX, y0:e.clientY, lx:e.clientX, ly:e.clientY});
  if (e.pointerType === "touch") kb.timer = setTimeout(() => { if (kb.card && !kb.on){ kbStart(); kbMove(kb.lx, kb.ly); } }, 280);
});
document.addEventListener("pointermove", e => {
  if (!kb.card || e.pointerId !== kb.pid) return;
  kb.lx = e.clientX; kb.ly = e.clientY;
  if (!kb.on){
    const far = Math.abs(e.clientX - kb.x0) + Math.abs(e.clientY - kb.y0) > 6;
    if (e.pointerType === "touch"){ if (far){ clearTimeout(kb.timer); Object.assign(kb, {card:null, id:null, pid:null}); } return; }
    if (!far) return;
    kbStart();
  }
  e.preventDefault(); kbMove(e.clientX, e.clientY);
});
document.addEventListener("touchmove", e => { if (!kb.on) return; e.preventDefault(); const t = e.touches[0]; if (t) kbMove(t.clientX, t.clientY); }, {passive:false});
document.addEventListener("touchend", () => { if (kb.on) kbEnd(true); });
document.addEventListener("pointerup", e => { if (kb.card && e.pointerId === kb.pid){ if (kbEnd(true)){ e.preventDefault(); kb.justDropped = true; setTimeout(() => { kb.justDropped = false; }, 0); } } });
document.addEventListener("pointercancel", e => { if (kb.card && e.pointerId === kb.pid && !kb.on) kbEnd(false); });
document.addEventListener("click", e => { if (kb.justDropped){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && kb.on) kbEnd(false); });
document.addEventListener("contextmenu", e => { if (kb.on || (kb.card && e.target.closest("[data-oppcard]"))) e.preventDefault(); });

/* ---------- Arrastrar bloques de Inicio y Análisis ---------- */
const sd = {item:null};
function sdTarget(x, y){
  sd.ghost.style.display = "none"; const el = document.elementFromPoint(x, y); sd.ghost.style.display = "";
  const t = el && el.closest("[data-sitem]"); return t && t !== sd.item && t.parentElement === sd.cont ? t : null;
}
function sdMove(x, y){
  sd.lx = x; sd.ly = y;
  sd.ghost.style.left = (x - sd.dx) + "px"; sd.ghost.style.top = (y - sd.dy) + "px";
  const t = sdTarget(x, y);
  if (t){
    const r = t.getBoundingClientRect();
    const before = y < r.top + r.height * .25 ? true : y > r.bottom - r.height * .25 ? false : x < r.left + r.width / 2;
    if (before && t.previousElementSibling !== sd.item) sd.cont.insertBefore(sd.item, t);
    else if (!before && t.nextElementSibling !== sd.item) sd.cont.insertBefore(sd.item, t.nextElementSibling);
  }
  cancelAnimationFrame(sd.raf);
  const step = () => { let m = false; if (sd.ly > innerHeight - 56){ window.scrollBy(0, 14); m = true; } else if (sd.ly < 120){ window.scrollBy(0, -14); m = true; } if (m && sd.item){ sdMove(sd.lx, sd.ly); } };
  sd.raf = requestAnimationFrame(step);
}
function sdEnd(commit){
  if (!sd.item) return;
  cancelAnimationFrame(sd.raf);
  const ids = [...sd.cont.children].filter(x => x.dataset && x.dataset.sitem).map(x => x.dataset.sitem), group = sd.group, changed = ids.join() !== sd.start;
  sd.ghost.remove(); document.body.classList.remove("s-dragging");
  Object.assign(sd, {item:null, ghost:null, cont:null});
  if (commit && changed){ sortSet(group, ids); toast("Orden guardado"); }
  render();
}
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-shandle]"); if (!h || e.button !== 0 || sd.item) return;
  const item = h.closest("[data-sitem]"), cont = item && item.parentElement; if (!cont || !cont.dataset.sortable) return;
  e.preventDefault();
  const r = item.getBoundingClientRect();
  const g = item.cloneNode(true); g.classList.add("s-ghost"); g.removeAttribute("data-sitem"); g.style.width = r.width + "px"; g.style.left = r.left + "px"; g.style.top = r.top + "px";
  document.body.appendChild(g);
  Object.assign(sd, {item, cont, group:cont.dataset.sortable, ghost:g, pid:e.pointerId, dx:e.clientX - r.left, dy:e.clientY - r.top, lx:e.clientX, ly:e.clientY, start:[...cont.children].map(x => x.dataset.sitem).join()});
  item.classList.add("s-ph"); document.body.classList.add("s-dragging");
});
document.addEventListener("pointermove", e => { if (!sd.item || e.pointerId !== sd.pid) return; e.preventDefault(); sdMove(e.clientX, e.clientY); });
document.addEventListener("pointerup", e => { if (sd.item && e.pointerId === sd.pid) sdEnd(true); });
document.addEventListener("pointercancel", e => { if (sd.item && e.pointerId === sd.pid) sdEnd(true); });
document.addEventListener("touchmove", e => { if (sd.item) e.preventDefault(); }, {passive:false});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sd.item) sdEnd(false); });

/* ---------- Arrastrar módulos ---------- */
let dragMod = null;
document.addEventListener("dragstart", e => { const r = e.target.closest && e.target.closest(".mod-row"); if (!r) return; dragMod = r.dataset.mod; r.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", dragMod); e.dataTransfer.effectAllowed = "move"; } catch(err){} });
document.addEventListener("dragover", e => {
  const r = e.target.closest && e.target.closest(".mod-row"); if (!r || !dragMod) return;
  e.preventDefault(); const after = e.clientY > r.getBoundingClientRect().top + r.offsetHeight / 2;
  document.querySelectorAll(".mod-row").forEach(x => x.classList.remove("drop-before", "drop-after"));
  if (r.dataset.mod !== dragMod) r.classList.add(after ? "drop-after" : "drop-before");
});
document.addEventListener("drop", e => {
  const r = e.target.closest && e.target.closest(".mod-row"); if (!r || !dragMod) return;
  e.preventDefault(); const target = r.dataset.mod; const after = r.classList.contains("drop-after");
  if (target !== dragMod){ P.order = P.order.filter(x => x !== dragMod); const i = P.order.indexOf(target); P.order.splice(after ? i + 1 : i, 0, dragMod); savePrefs(); }
  dragMod = null; render();
});
document.addEventListener("dragend", () => { dragMod = null; document.querySelectorAll(".mod-row").forEach(x => x.classList.remove("dragging", "drop-before", "drop-after")); });

document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset || !("cobq" in t.dataset)) return;
  cobF.q = t.value; const pos = t.selectionStart; render(); const n = document.querySelector("[data-cobq]"); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(err){} }
});
/* ---------- Inicio de la app ---------- */
function boot(remote){
  if (remote) S = normalize(remote) || S;
  DB.prime(S); ensureData(); autoRun(); save();
  view = "inicio"; try { history.replaceState(null, "", "#inicio"); } catch(e){}
  render();
  filesLoad();
}
if (CLOUD){ cloudStart(); window.addEventListener("hashchange", () => { if (/access_token=|error_description=/.test(location.hash)) cloudStart(); }); }
else boot(null);
})();
